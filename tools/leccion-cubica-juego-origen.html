<style>

* { box-sizing: border-box; }
body {

button.btn, a.btn {

}

button.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.score {

.score.ok { color: var(--ok); border-color: rgba(90,212,168,0.45); }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }

.expr-panel {
  display: flex; flex-direction: column; gap: 8px;

}
.expr-row {

}
.expr-row::before {

}
.expr-row.phase-ask::before { background: var(--amber); }
.expr-formula {

}
.expr-formula .sqrt { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 0.1em; }

.expr-formula .sqrt .sym { font-size: 1.15em; line-height: 1; margin-right: 1px; }
.expr-formula .hl-v { color: var(--rise); }

.expr-formula .hl-xa { color: #94a3b8; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 6px; }
.chip {

  padding: 5px 8px; border-radius: 999px; border: 1px solid #2a3548; background: #121a27; color: var(--ink);
}
.chip.amber { color: var(--xp); border-color: rgba(245,158,11,0.45); }
.chip.blue { color: #60a5fa; border-color: rgba(96,165,250,0.45); }
.chip.wall { color: #94a3b8; border-color: rgba(148,163,184,0.45); }
.mode-tag {

.chip-btn {

}
.chip-btn:hover { filter: brightness(1.1); border-color: var(--mast); }
.chip-btn.correct { border-color: var(--ok); color: var(--ok); background: rgba(90,212,168,0.12); }
.chip-btn.wrong { border-color: var(--bad); color: var(--bad); background: rgba(255,123,123,0.1); }

.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 6px; }
.row-label { font-size: 0.78rem; color: var(--muted); font-weight: 650; padding-left: 6px; margin-bottom: 4px; }
.graph-wrap { position: relative; min-width: 0; }
canvas#c { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--canvas-bg); touch-action: none; }

#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; border-radius: 10px; background: transparent; }
.paused-banner, .victory-banner {

.lesson-nav {

.prompt .hl-xa { color: #94a3b8; font-family: ui-monospace, Menlo, monospace; font-weight: 800; }

a.back { color: var(--mast); font-size: 0.82rem; text-decoration: none; }

      successRound("¡Bien! (" + fmtNum(state.target.x) + ")³ = " + fmtNum(state.target.y) + ".", "20 éxitos · cúbica · origen");
    } else {
      failRound("El punto es <span class=\"hl-cub\">" + fmtPt(state.target) + "</span> · y = x³.");
    }
  }
  function startRound(keepScores){
    clearTimers(); buildRound(); state.locked=false;
    if (!keepScores){ state.ok=0; state.bad=0; state.round=1; }
    state.won=false; if (victoryBanner) victoryBanner.classList.remove("on");
    exprFormula.innerHTML = formulaCubicHTML(state.p);
    chipBox.innerHTML = '<span class="chip cub">y = x³</span><span class="chip">x = '+fmtNum(state.target.x)+'</span><span class="chip amber">¿y?</span>';
    sideHint.textContent = "Colocá (x, x³) en la retícula";
    if (modeTagEl) modeTagEl.textContent = "Origen";
    syncScores();
    setPrompt('Colocá el punto <span class="hl-cub">('+fmtNum(state.target.x)+', '+fmtNum(state.target.x)+'³)</span> sobre <span class="hl-cub">y = x³</span>.', "attention");
    draw();
  }
  function nextRound(){ state.round++; syncScores(); startRound(true); }
  canvas.addEventListener("click", onClick); canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("touchstart", function(ev){ ev.preventDefault(); onClick(ev); }, {passive:false});
  wireChrome(standardRestart(), standardKeep()); startRound(false);

})();
</script>
</body>
