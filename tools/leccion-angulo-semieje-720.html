<script>
(function () {
  "use strict";

  const MIN_DEG = -720;
  const MAX_DEG = 720;
  const NOTABLE_BASE = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330];
  const PRESETS = (function buildPresets() {
    const s = new Set();
    for (const base of NOTABLE_BASE) {
      for (let k = -2; k <= 2; k++) {
        const d = base + k * 360;
        if (d >= MIN_DEG && d <= MAX_DEG) s.add(d);
      }
    }
    s.add(-720); s.add(-360); s.add(0); s.add(360); s.add(720);
    // 45-family across turns already covered; ensure ±405 etc. via base+360
    return Array.from(s).sort((a, b) => a - b);
  })();
  const AMBER = "#FFBF00";
  const MAST = "#60a5fa";
  const TEAL = "#34d399";
  const PINK = "#f472b6";

  const EXACT = {
    0:   { cos: "1", sin: "0" },
    30:  { cos: "√3/2", sin: "1/2" },
    45:  { cos: "√2/2", sin: "√2/2" },
    60:  { cos: "1/2", sin: "√3/2" },
    90:  { cos: "0", sin: "1" },
    120: { cos: "−1/2", sin: "√3/2" },
    135: { cos: "−√2/2", sin: "√2/2" },
    150: { cos: "−√3/2", sin: "1/2" },
    180: { cos: "−1", sin: "0" },
    210: { cos: "−√3/2", sin: "−1/2" },
    225: { cos: "−√2/2", sin: "−√2/2" },
    240: { cos: "−1/2", sin: "−√3/2" },
    270: { cos: "0", sin: "−1" },
    300: { cos: "1/2", sin: "−√3/2" },
    315: { cos: "√2/2", sin: "−√2/2" },
    330: { cos: "√3/2", sin: "−1/2" },
    360: { cos: "1", sin: "0" }
  };

  const WORD_MAP = {
    "cero": 0, "zero": 0,
    "treinta": 30,
    "cuarenta y cinco": 45, "cuarentaicinco": 45, "quarenta y cinco": 45,
    "sesenta": 60,
    "noventa": 90,
    "ciento veinte": 120, "cientoveinte": 120,
    "ciento treinta y cinco": 135, "cientotreintaycinco": 135,
    "ciento cincuenta": 150, "cientocincuenta": 150,
    "ciento ochenta": 180, "cientoochenta": 180,
    "doscientos diez": 210, "doscientosdiez": 210,
    "doscientos veinticinco": 225, "doscientosveinticinco": 225,
    "doscientos cuarenta": 240, "doscientoscuarenta": 240,
    "doscientos setenta": 270, "doscientossetenta": 270,
    "trescientos": 300,
    "trescientos quince": 315, "trescientosquince": 315,
    "trescientos treinta": 330, "trescientostreinta": 330,
    "trescientos sesenta": 360, "trescientossesenta": 360,
    "trescientos noventa": 390, "trescientosnoventa": 390,
    "cuatrocientos": 400,
    "cuatrocientos veinte": 420, "cuatrocientosveinte": 420,
    "cuatrocientos cincuenta": 450, "cuatrocientoscincuenta": 450,
    "cuatrocientos ochenta": 480, "cuatrocientosochenta": 480,
    "quinientos": 500,
    "quinientos cuarenta": 540, "quinientoscuarenta": 540,
    "seiscientos": 600,
    "seiscientos treinta": 630, "seiscientostreinta": 630,
    "setecientos": 700,
    "setecientos veinte": 720, "setecientosveinte": 720,
    "menos treinta": -30,
    "menos cuarenta y cinco": -45, "menos cuarentaicinco": -45,
    "menos sesenta": -60,
    "menos noventa": -90,
    "menos ciento veinte": -120, "menos cientoveinte": -120,
    "menos ciento treinta y cinco": -135,
    "menos ciento cincuenta": -150,
    "menos ciento ochenta": -180, "menos cientoochenta": -180,
    "menos doscientos diez": -210,
    "menos doscientos veinticinco": -225,
    "menos doscientos cuarenta": -240,
    "menos doscientos setenta": -270,
    "menos trescientos": -300,
    "menos trescientos quince": -315,
    "menos trescientos treinta": -330,
    "menos trescientos sesenta": -360,
    "menos trescientos noventa": -390,
    "menos cuatrocientos cincuenta": -450,
    "menos quinientos cuarenta": -540,
    "menos seiscientos treinta": -630,
    "menos setecientos veinte": -720
  };

  const UNITS = {
    "cero": 0, "un": 1, "uno": 1, "una": 1, "dos": 2, "tres": 3, "cuatro": 4,
    "cinco": 5, "seis": 6, "siete": 7, "ocho": 8, "nueve": 9,
    "diez": 10, "once": 11, "doce": 12, "trece": 13, "catorce": 14, "quince": 15,
    "dieciseis": 16, "diecisiete": 17, "dieciocho": 18, "diecinueve": 19,
    "veinte": 20, "veintiun": 21, "veintiuno": 21, "veintidos": 22, "veintitres": 23,
    "veinticuatro": 24, "veinticinco": 25, "veintiseis": 26, "veintisiete": 27,
    "veintiocho": 28, "veintinueve": 29,
    "treinta": 30, "cuarenta": 40, "cincuenta": 50, "sesenta": 60,
    "setenta": 70, "ochenta": 80, "noventa": 90
  };
  const HUNDREDS = {
    "ciento": 100, "cien": 100,
    "doscientos": 200, "trescientos": 300, "cuatrocientos": 400,
    "quinientos": 500, "seiscientos": 600, "setecientos": 700
  };

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const pillsRow = document.getElementById("pillsRow");
  const speakBtn = document.getElementById("speakBtn");
  const resetBtn = document.getElementById("resetBtn");
  const voiceStatus = document.getElementById("voiceStatus");
  const voiceHint = document.getElementById("voiceHint");
  const degOut = document.getElementById("degOut");
  const radOut = document.getElementById("radOut");
  const sinOut = document.getElementById("sinOut");
  const cosOut = document.getElementById("cosOut");

  let thetaDeg = 0;
  let dragging = false;
  let recognition = null;
  let listening = false;

  // Build pills
  function fmtDegLabel(d) {
    const n = Math.round(d);
    return (n < 0 ? "−" + Math.abs(n) : String(n)) + "°";
  }

  PRESETS.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pill";
    b.dataset.deg = String(d);
    b.textContent = fmtDegLabel(d);
    b.addEventListener("click", () => setAngle(d, true));
    pillsRow.appendChild(b);
  });

  function normDeg(d) {
    let x = d % 360;
    if (x < 0) x += 360;
    if (Object.is(x, -0) || Math.abs(x) < 1e-9) x = 0;
    return x;
  }

  function clampDeg(d) {
    return Math.max(MIN_DEG, Math.min(MAX_DEG, d));
  }

  function roundNice(d) {
    return Math.round(clampDeg(d) * 10) / 10;
  }

  function displayDeg(d) {
    const x = roundNice(d);
    if (Math.abs(x - Math.round(x)) < 0.05) return Math.round(x);
    return x;
  }

  function fmtSigned(n) {
    const v = displayDeg(n);
    return (v < 0 ? "−" + Math.abs(v) : String(v));
  }

  function locusKeyForDeg(deg) {
    const d = Math.round(normDeg(deg) * 1000) / 1000;
    const eps = 0.05;
    if (Math.abs(d) < eps || Math.abs(d - 180) < eps || Math.abs(d - 360) < eps) return "x";
    if (Math.abs(d - 90) < eps || Math.abs(d - 270) < eps) return "y";
    if (d > 0 && d < 90) return "q1";
    if (d > 90 && d < 180) return "q2";
    if (d > 180 && d < 270) return "q3";
    return "q4";
  }

  function syncLocusStrip(key) {
    const root = document.getElementById("locusStrip");
    if (!root) return;
    root.querySelectorAll(".locus").forEach((el) => {
      el.classList.toggle("on", key != null && el.dataset.locus === key);
    });
  }

  function syncPills() {
    const d = Math.round(thetaDeg);
    pillsRow.querySelectorAll(".pill").forEach((el) => {
      el.classList.toggle("on", Number(el.dataset.deg) === d);
    });
  }

  function fmtNum(n) {
    const s = (Math.round(n * 1000) / 1000).toString();
    return s.replace(/^-/, "−");
  }

  function radLabel(deg) {
    const d = deg;
    const specials = {
      0: "0",
      30: "π/6", 45: "π/4", 60: "π/3", 90: "π/2",
      120: "2π/3", 135: "3π/4", 150: "5π/6", 180: "π",
      210: "7π/6", 225: "5π/4", 240: "4π/3", 270: "3π/2",
      300: "5π/3", 315: "7π/4", 330: "11π/6", 360: "2π",
      390: "13π/6", 405: "9π/4", 420: "7π/3", 450: "5π/2",
      480: "8π/3", 495: "11π/4", 540: "3π", 630: "7π/2", 720: "4π",
      [-30]: "−π/6", [-45]: "−π/4", [-60]: "−π/3", [-90]: "−π/2",
      [-120]: "−2π/3", [-135]: "−3π/4", [-150]: "−5π/6", [-180]: "−π",
      [-210]: "−7π/6", [-225]: "−5π/4", [-240]: "−4π/3", [-270]: "−3π/2",
      [-300]: "−5π/3", [-315]: "−7π/4", [-330]: "−11π/6", [-360]: "−2π",
      [-390]: "−13π/6", [-405]: "−9π/4", [-450]: "−5π/2",
      [-540]: "−3π", [-630]: "−7π/2", [-720]: "−4π"
    };
    const k = Math.round(d);
    if (specials[k] != null && Math.abs(d - k) < 0.05) return specials[k];
    // principal special as fallback markup with turns
    const p = Math.round(normDeg(d));
    const turns = Math.trunc(d / 360);
    if (specials[p] != null && Math.abs(normDeg(d) - p) < 0.05 && turns !== 0 && p !== 0) {
      const sign = d < 0 ? "−" : "";
      const absTurns = Math.abs(turns);
      // prefer exact numeric rad for multi-turn non-table
    }
    return fmtNum((d * Math.PI) / 180);
  }

  function trigLabels(deg) {
    const d = normDeg(deg);
    const k = Math.round(d);
    if (EXACT[k] && Math.abs(d - k) < 0.05) return EXACT[k];
    // nearest special within 0.5°
    if (EXACT[k] && Math.abs(d - k) < 0.5) return EXACT[k];
    const a = (d * Math.PI) / 180;
    return { cos: fmtNum(Math.cos(a)), sin: fmtNum(Math.sin(a)) };
  }

  function setAngle(deg, fromPill) {
    if (fromPill) thetaDeg = clampDeg(Math.round(deg));
    else thetaDeg = roundNice(deg);
    updateUI();
    draw();
  }

  function updateUI() {
    const d = thetaDeg;
    degOut.textContent = fmtSigned(d) + "°";
    radOut.textContent = radLabel(d);
    const t = trigLabels(d);
    sinOut.textContent = t.sin;
    cosOut.textContent = t.cos;
    syncPills();
    syncLocusStrip(locusKeyForDeg(d));
  }

  function layout() {
    const w = canvas.width, h = canvas.height;
    const cx = w * 0.5, cy = h * 0.52;
    const R = Math.min(w, h) * 0.36;
    return { w, h, cx, cy, R };
  }

  function draw() {
    const { w, h, cx, cy, R } = layout();
    ctx.clearRect(0, 0, w, h);

    // subtle grid
    ctx.save();
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 1;
    const step = R / 4;
    for (let x = cx; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let x = cx - step; x > 0; x -= step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = cy; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    for (let y = cy - step; y > 0; y -= step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.restore();

    // axes
    const axPad = 36;
    ctx.save();
    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(axPad, cy); ctx.lineTo(w - axPad, cy);
    ctx.moveTo(cx, axPad); ctx.lineTo(cx, h - axPad);
    ctx.stroke();

    // strong positive X ray
    ctx.strokeStyle = AMBER;
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R + 48, cy);
    ctx.stroke();
    // arrowhead +X
    const tipX = cx + R + 48, tipY = cy;
    ctx.fillStyle = AMBER;
    ctx.beginPath();
    ctx.moveTo(tipX + 12, tipY);
    ctx.lineTo(tipX - 2, tipY - 8);
    ctx.lineTo(tipX - 2, tipY + 8);
    ctx.closePath();
    ctx.fill();

    // Y arrow
    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 1.5;
    ctx.fillStyle = "#94a3b8";
    ctx.beginPath();
    ctx.moveTo(cx, axPad - 4);
    ctx.lineTo(cx - 7, axPad + 10);
    ctx.lineTo(cx + 7, axPad + 10);
    ctx.closePath();
    ctx.fill();

    // labels
    ctx.font = "700 15px Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = AMBER;
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("semieje X+", tipX - 70, tipY - 12);
    ctx.fillStyle = "#94a3b8";
    ctx.textAlign = "left";
    ctx.fillText("X", w - axPad - 8, cy + 22);
    ctx.textAlign = "right";
    ctx.fillText("Y", cx - 12, axPad + 4);
    ctx.restore();

    // unit circle
    ctx.save();
    ctx.strokeStyle = MAST;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();
    // faint fill
    ctx.fillStyle = "rgba(96,165,250,0.04)";
    ctx.fill();
    ctx.restore();

    // quadrant faint labels
    ctx.save();
    ctx.font = "700 18px Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "rgba(139,155,180,0.35)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const qOff = R * 0.42;
    ctx.fillText("I", cx + qOff, cy - qOff);
    ctx.fillText("II", cx - qOff, cy - qOff);
    ctx.fillText("III", cx - qOff, cy + qOff);
    ctx.fillText("IV", cx + qOff, cy + qOff);
    ctx.restore();

    const principal = normDeg(thetaDeg);
    const a = (principal * Math.PI) / 180;
    // canvas y is down, so negate sin for screen
    const px = cx + R * Math.cos(a);
    const py = cy - R * Math.sin(a);

    // Arc: geometry uses principal; multi-turn shown as concentric winding rings + sector
    const arcR0 = R * 0.22;
    const signedTurns = thetaDeg >= 0
      ? Math.floor(thetaDeg / 360)
      : Math.ceil(thetaDeg / 360); // 0 when |θ|<360; ±1,±2 for full winds
    const rem = thetaDeg - signedTurns * 360; // remainder with sign, in (-360,360)
    const absTurns = Math.abs(signedTurns);

    ctx.save();
    // winding rings (full turns)
    for (let i = 0; i < absTurns; i++) {
      const rr = arcR0 + i * 10;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI * 2, thetaDeg < 0);
      ctx.strokeStyle = "rgba(255,191,0," + (0.55 - i * 0.12) + ")";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    // remaining arc / sector
    const arcR = arcR0 + absTurns * 10;
    const remAbs = Math.abs(rem);
    if (remAbs > 0.05) {
      const anticlockwise = rem > 0; // positive θ → CCW on math = canvas anticlockwise with -a
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + arcR, cy);
      if (remAbs >= 359.5) {
        ctx.arc(cx, cy, arcR, 0, Math.PI * 2, anticlockwise);
      } else if (rem > 0) {
        ctx.arc(cx, cy, arcR, 0, -((rem * Math.PI) / 180), true);
      } else {
        // negative: clockwise |rem| from +X (canvas CW = anticlockwise false)
        ctx.arc(cx, cy, arcR, 0, ((-rem) * Math.PI) / 180, false);
      }
      ctx.closePath();
      ctx.fillStyle = "rgba(255,191,0,0.28)";
      ctx.fill();
      ctx.strokeStyle = AMBER;
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (remAbs >= 359.5) {
        ctx.arc(cx, cy, arcR, 0, Math.PI * 2, anticlockwise);
      } else if (rem > 0) {
        ctx.arc(cx, cy, arcR, 0, -((rem * Math.PI) / 180), true);
      } else {
        ctx.arc(cx, cy, arcR, 0, ((-rem) * Math.PI) / 180, false);
      }
      ctx.stroke();
    } else if (absTurns > 0 && Math.abs(thetaDeg) >= 359.5) {
      // pure multi-turn with rem≈0 already drawn as rings; highlight outermost
    }
    ctx.restore();

    // θ label (full angle) + optional winding hint
    ctx.save();
    const midAng = a / 2;
    const labelR = arcR + 30;
    const lx = cx + labelR * Math.cos(midAng === 0 ? 0.35 : midAng);
    const ly = cy - labelR * Math.sin(midAng === 0 ? 0.35 : midAng);
    ctx.font = "800 26px Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = AMBER;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.55)";
    ctx.shadowBlur = 8;
    ctx.fillText("θ = " + fmtSigned(thetaDeg) + "°", lx, ly);
    if (absTurns > 0) {
      ctx.font = "700 13px Segoe UI, system-ui, sans-serif";
      ctx.fillStyle = "#f5e6a8";
      const hint = (thetaDeg < 0 ? "−" : "") + absTurns + " vuelta" + (absTurns === 1 ? "" : "s")
        + (remAbs > 0.05 ? " + " + fmtSigned(rem) + "°" : "");
      ctx.fillText(hint, lx, ly + 22);
    }
    ctx.restore();

    // movable ray
    ctx.save();
    ctx.strokeStyle = "#e9eef7";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(px, py);
    ctx.stroke();
    // extend a bit past circle
    const ex = cx + (R + 22) * Math.cos(a);
    const ey = cy - (R + 22) * Math.sin(a);
    ctx.strokeStyle = "rgba(233,238,247,0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    // arrow on ray
    const ang = Math.atan2(ey - cy, ex - cx);
    ctx.fillStyle = "#e9eef7";
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - 12 * Math.cos(ang) + 7 * Math.sin(ang), ey - 12 * Math.sin(ang) - 7 * Math.cos(ang));
    ctx.lineTo(ex - 12 * Math.cos(ang) - 7 * Math.sin(ang), ey - 12 * Math.sin(ang) + 7 * Math.cos(ang));
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // point on circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, py, 8, 0, Math.PI * 2);
    ctx.fillStyle = AMBER;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#0b1018";
    ctx.stroke();
    ctx.restore();

    // origin
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#e9eef7";
    ctx.fill();
    ctx.restore();

    // projections faint
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = "rgba(244,114,182,0.55)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(px, cy);
    ctx.stroke();
    ctx.strokeStyle = "rgba(52,211,153,0.55)";
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(cx, py);
    ctx.stroke();
    ctx.setLineDash([]);
    // ticks on axes
    ctx.fillStyle = PINK;
    ctx.beginPath(); ctx.arc(px, cy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = TEAL;
    ctx.beginPath(); ctx.arc(cx, py, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function canvasToAngle(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    const x = (clientX - rect.left) * sx;
    const y = (clientY - rect.top) * sy;
    const { cx, cy } = layout();
    const dx = x - cx;
    const dy = cy - y; // flip Y
    let deg = (Math.atan2(dy, dx) * 180) / Math.PI;
    if (deg < 0) deg += 360;
    // unwrap relative to current θ so drag can cross ±360 within domain
    const curP = normDeg(thetaDeg);
    let delta = deg - curP;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    return clampDeg(thetaDeg + delta);
  }

  function onPointerDown(e) {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    dragging = true;
    setAngle(canvasToAngle(e.clientX, e.clientY), false);
  }
  function onPointerMove(e) {
    if (!dragging) return;
    setAngle(canvasToAngle(e.clientX, e.clientY), false);
  }
  function onPointerUp(e) {
    dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }

  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);

  resetBtn.addEventListener("click", () => setAngle(0, true));

  // —— Voice ——
  function normalizeSpeech(s) {
    return (s || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/grados?/g, " ")
      .replace(/theta|angel|angulo/gi, " ")
      .replace(/[−–—]/g, "-")
      .replace(/,/g, " ")
      .replace(/\./g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function parseSpanishNumber(t) {
    // parse positive Spanish number words up to 720
    let s = t.replace(/\by\b/g, " ").replace(/\s+/g, " ").trim();
    if (!s) return null;
    if (UNITS[s] != null) return UNITS[s];
    if (HUNDREDS[s] != null) return HUNDREDS[s];
    // veintiX glued
    s = s.replace(/veinti /g, "veinti");
    let total = 0;
    const parts = s.split(" ").filter(Boolean);
    let i = 0;
    while (i < parts.length) {
      const w = parts[i];
      if (HUNDREDS[w] != null) {
        total += HUNDREDS[w];
        i++;
        continue;
      }
      if (UNITS[w] != null) {
        total += UNITS[w];
        i++;
        // optional "y" already stripped
        continue;
      }
      // treinta cinco → treinta + cinco already if split; "cuarentaicinco"
      const glued = Object.keys(UNITS).sort((a,b)=>b.length-a.length).find((k) => w.includes(k) && k.length > 2);
      if (glued && UNITS[glued] != null && w === glued) {
        total += UNITS[glued];
        i++;
        continue;
      }
      return null;
    }
    return total;
  }

  function parseAngleSpeech(raw) {
    let t = normalizeSpeech(raw);
    if (!t) return null;
    let neg = false;
    if (/^(menos|negativo)\b/.test(t) || t.startsWith("-")) {
      neg = true;
      t = t.replace(/^(menos|negativo)\s*/, "").replace(/^-\s*/, "").trim();
    }
    // direct word map (longest first) on full original and stripped
    const keys = Object.keys(WORD_MAP).sort((a, b) => b.length - a.length);
    const full = normalizeSpeech(raw).replace(/[−–—]/g, "-");
    for (const k of keys) {
      if (full === k || full.includes(k)) {
        const v = WORD_MAP[k];
        return clampDeg(v);
      }
    }
    // digits with optional minus
    const md = normalizeSpeech(raw).replace(/[−–—]/g, "-").match(/-?\d{1,4}/);
    if (md) {
      const n = Number(md[0]);
      if (n >= MIN_DEG && n <= MAX_DEG) return n;
    }
    const parsed = parseSpanishNumber(t);
    if (parsed != null && parsed >= 0 && parsed <= MAX_DEG) {
      return clampDeg(neg ? -parsed : parsed);
    }
    const compact = t.replace(/\s+/g, "");
    for (const k of keys) {
      if (compact.includes(k.replace(/\s+/g, ""))) return clampDeg(WORD_MAP[k]);
    }
    return null;
  }

  function setListening(on) {
    listening = on;
    speakBtn.classList.toggle("listening", on);
    speakBtn.textContent = on ? "● Escuchando…" : "🎙 Hablar ángulo";
    voiceStatus.className = "voice-status" + (on ? " live" : "");
    voiceStatus.textContent = on ? "Decí el ángulo… (ej. menos noventa, cuatrocientos cincuenta, 540)" : "";
  }

  function initSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      voiceHint.classList.add("warn");
      voiceHint.textContent = "Tu navegador no soporta reconocimiento de voz. Usá las pastillas o arrastrá el rayo.";
      speakBtn.disabled = true;
      speakBtn.title = "Voz no disponible";
      return null;
    }
    const rec = new SR();
    rec.lang = "es-AR";
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    rec.continuous = false;
    rec.onstart = () => setListening(true);
    rec.onend = () => setListening(false);
    rec.onerror = (ev) => {
      setListening(false);
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        voiceStatus.className = "voice-status bad";
        voiceStatus.textContent = "Micrófono bloqueado. Usá pastillas o arrastre.";
      } else if (ev.error !== "aborted" && ev.error !== "no-speech") {
        voiceStatus.className = "voice-status bad";
        voiceStatus.textContent = "No se pudo escuchar. Probá de nuevo o usá pastillas.";
      }
    };
    rec.onresult = (ev) => {
      let best = null;
      let heard = "";
      for (let i = 0; i < ev.results.length; i++) {
        for (let j = 0; j < ev.results[i].length; j++) {
          const alt = ev.results[i][j].transcript;
          heard = heard || alt;
          const parsed = parseAngleSpeech(alt);
          if (parsed != null) { best = parsed; heard = alt; break; }
        }
        if (best != null) break;
      }
      if (best != null) {
        setAngle(best, true);
        voiceStatus.className = "voice-status ok";
        voiceStatus.textContent = "Escuché «" + heard.trim() + "» → " + fmtSigned(best) + "°";
      } else {
        voiceStatus.className = "voice-status bad";
        voiceStatus.textContent = "No reconocí el ángulo en «" + (heard || "?").trim() + "». Probá: menos noventa, 450, setecientos veinte…";
      }
    };
    return rec;
  }

  recognition = initSpeech();

  speakBtn.addEventListener("click", () => {
    if (!recognition) return;
    if (listening) {
      try { recognition.stop(); } catch (_) {}
      return;
    }
    try {
      recognition.lang = "es-AR";
      recognition.start();
    } catch (err) {
      // retry with es-ES
      try {
        recognition.lang = "es-ES";
        recognition.start();
      } catch (e2) {
        voiceStatus.className = "voice-status bad";
        voiceStatus.textContent = "No se pudo iniciar la voz. Usá pastillas o arrastre.";
      }
    }
  });

  setAngle(45, true);
})();
</script>
</body>
</html>
