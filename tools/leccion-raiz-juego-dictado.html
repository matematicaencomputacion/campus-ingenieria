<script>
(function () {
  "use strict";
var GK = window.CampusGameKit || {};
  var WIN_AT = 20;
  var AMBER = "#f59e0b", AMBER_GLOW = "rgba(245,158,11,0.4)", MUTED = "#8b9bb4";
  var OK = "#5ad4a8", BAD = "#ff7b7b", WALL = "#94a3b8", RUN = "#60a5fa";
  var RISE_UP = "#ff4d4d", RISE_DN = "#60a5fa", CURVE_UP = "#ff4d4d", CURVE_DN = "#60a5fa", PURPLE = "#a78bfa";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var confettiCanvas = document.getElementById("confetti");
  var graphWrap = document.getElementById("graphWrap");
  var promptEl = document.getElementById("prompt");
  var soundMeter = document.getElementById("soundMeter");
  var pauseBtn = document.getElementById("pauseBtn");
  var restartBtn = document.getElementById("restartBtn");
  var slowBtn = document.getElementById("slowBtn");
  var pausedBanner = document.getElementById("pausedBanner");
  var victoryBanner = document.getElementById("victoryBanner");
  var victoryRestart = document.getElementById("victoryRestart");
  var victoryContinue = document.getElementById("victoryContinue");
  var scoreOk = document.getElementById("scoreOk");
  var scoreBad = document.getElementById("scoreBad");
  var scoreRound = document.getElementById("scoreRound");
  var exprFormula = document.getElementById("exprFormula");
  var sideHint = document.getElementById("sideHint");
  var chipBox = document.getElementById("chipBox");
  var modeTagEl = document.getElementById("modeTag");
  var helpBtn = document.getElementById("helpBtn");
  var helpPanel = document.getElementById("helpPanel");
  var helpEq = document.getElementById("helpEq");
  var helpBody = document.getElementById("helpBody");

  var XMIN = -4, XMAX = 10, YMIN = -2, YMAX = 6;
  var PAD = { l: 52, r: 28, t: 28, b: 42 };
  var CELL_PX = 48;

  function delay(ms) { return ms * (state.speedFactor || 1); }
  function clearTimers() { (state.timers || []).forEach(function (id) { clearTimeout(id); }); state.timers = []; }
  function later(ms, fn) { var id = setTimeout(fn, delay(ms)); state.timers.push(id); return id; }
  function fmtNum(n) {
    if (Object.is(n, -0) || Math.abs(n) < 1e-12) return "0";
    if (Math.abs(n - 0.5) < 1e-9) return "1/2";
    if (Math.abs(n + 0.5) < 1e-9) return "−1/2";
    if (Math.abs(n - 0.25) < 1e-9) return "1/4";
    if (Math.abs(n + 0.25) < 1e-9) return "−1/4";
    if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n)).replace("-", "−");
    return String(Math.round(n * 1000) / 1000).replace("-", "−");
  }
  function sqrtHTML(inner) {
    return '<span class="sqrt"><span class="sym">√</span><span class="rad">' + inner + '</span></span>';
  }
  function formulaHTML(p) {
    var vPart = '<span class="hl-v">' + fmtNum(p.v) + '</span>';
    var hPart = '<span class="hl-h">' + fmtNum(p.h) + '</span>';
    var xa = p.xa, yp = p.yp, rad;
    if (p.side === "left") {
      if (xa === 0) rad = "(−x)";
      else if (xa > 0) rad = "(" + fmtNum(xa) + " − x)";
      else rad = "(−" + fmtNum(-xa) + " − x)";
    } else {
      if (xa === 0) rad = "x";
      else if (xa > 0) rad = "(x − " + fmtNum(xa) + ")";
      else rad = "(x + " + fmtNum(-xa) + ")";
    }
    if (p.h !== 1) rad = rad + " / " + hPart;
    var ypPart = "";
    if (yp > 0) ypPart = ' + <span class="hl-yp">' + fmtNum(yp) + '</span>';
    else if (yp < 0) ypPart = ' − <span class="hl-yp">' + fmtNum(-yp) + '</span>';
    var mul = "";
    if (p.v === -1) mul = "−";
    else if (p.v !== 1) mul = vPart + " · ";
    return "f(x) = " + mul + sqrtHTML(rad) + ypPart;
  }
  function landing(p, n) {
    var s = (p.side === "left") ? -1 : 1;
    return { x: p.xa + s * n * n * p.h, y: p.yp + n * p.v };
  }
  function fSqrt(p, x) {
    var h = p.h || 1, t;
    if (p.side === "left") { if (x > p.xa + 1e-9) return null; t = (p.xa - x) / h; }
    else { if (x < p.xa - 1e-9) return null; t = (x - p.xa) / h; }
    if (t < 0) return null;
    return p.v * Math.sqrt(t) + p.yp;
  }
  function pickParams(opts) {
    opts = opts || {};
    var tries = 0;
    while (tries++ < 400) {
      var xa = [-1, 0, 1, 2][(Math.random() * 4) | 0];
      var yp = [-1, 0, 1, 2][(Math.random() * 4) | 0];
      var h = [1, 1, 1, 2][(Math.random() * 4) | 0];
      var v = [1, 2, 3, -1, -2, -3, 0.5][(Math.random() * 7) | 0];
      var side = opts.side || (Math.random() < 0.55 ? "right" : "left");
      var p = { xa: xa, yp: yp, h: h, v: v, side: side };
      var ok = true;
      for (var n = 1; n <= 3; n++) {
        var pt = landing(p, n);
        if (Math.abs(pt.x) > 16 || Math.abs(pt.y) > 14) { ok = false; break; }
      }
      if (ok) return p;
    }
    return { xa: 0, yp: 0, h: 1, v: 1, side: opts.side || "right" };
  }
  function fitWorld(p, nMax) {
    nMax = nMax || 3;
    var h = Math.abs(p.h) || 1, far = nMax * nMax * h;
    if (p.side === "left") { XMAX = Math.max(p.xa + 1, 1); XMIN = Math.min(p.xa - far - 1, -2); }
    else { XMIN = Math.min(p.xa - 1, -1); XMAX = Math.max(p.xa + far + 1, 4); }
    if (p.v >= 0) { YMIN = Math.min(-1, p.yp - 1); YMAX = Math.max(p.yp + nMax * p.v + 1, 3); }
    else { YMAX = Math.max(p.yp + 1, 1); YMIN = p.yp + nMax * p.v - 1; }
    sizeCanvas();
  }
  function sizeCanvas() {
    var spanX = Math.max(1, XMAX - XMIN), spanY = Math.max(1, YMAX - YMIN), cell = CELL_PX;
    var w = Math.round(PAD.l + spanX * cell + PAD.r), hh = Math.round(PAD.t + spanY * cell + PAD.b);
    if (w > 1200 || hh > 820) {
      cell = Math.max(28, Math.floor(Math.min((1200 - PAD.l - PAD.r) / spanX, (820 - PAD.t - PAD.b) / spanY)));
      w = Math.round(PAD.l + spanX * cell + PAD.r); hh = Math.round(PAD.t + spanY * cell + PAD.b);
    }
    canvas.width = w; canvas.height = hh;
  }
  function worldToScreen(x, y) {
    var w = canvas.width - PAD.l - PAD.r, hh = canvas.height - PAD.t - PAD.b;
    return { x: PAD.l + ((x - XMIN) / (XMAX - XMIN)) * w, y: PAD.t + ((YMAX - y) / (YMAX - YMIN)) * hh };
  }
  function screenToWorld(sx, sy) {
    var w = canvas.width - PAD.l - PAD.r, hh = canvas.height - PAD.t - PAD.b;
    return { x: XMIN + ((sx - PAD.l) / w) * (XMAX - XMIN), y: YMAX - ((sy - PAD.t) / hh) * (YMAX - YMIN) };
  }
  function eventToCanvas(ev) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    var clientX = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
    var clientY = (ev.touches && ev.touches[0]) ? ev.touches[0].clientY : ev.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }
  function snapLattice(wx, wy) {
    var xi = Math.round(wx), yi = Math.round(wy);
    xi = Math.max(Math.ceil(XMIN), Math.min(Math.floor(XMAX), xi));
    yi = Math.max(Math.ceil(YMIN), Math.min(Math.floor(YMAX), yi));
    return { x: xi, y: yi };
  }
  function nearPt(a, b, tol) { tol = tol == null ? 0.35 : tol; return Math.abs(a.x - b.x) <= tol && Math.abs(a.y - b.y) <= tol; }
  function syncScores() {
    scoreOk.innerHTML = "Éxitos <strong>" + state.ok + "</strong>";
    scoreBad.innerHTML = "Errores <strong>" + state.bad + "</strong>";
    scoreRound.innerHTML = "Ronda <strong>" + state.round + "</strong>";
  }
  function setPrompt(html, cls) { promptEl.className = "prompt" + (cls ? (" " + cls) : ""); promptEl.innerHTML = html; }
  function pulseOk() {
    if (GK.playOkChime) GK.playOkChime();
    if (GK.pulseSoundMeter) GK.pulseSoundMeter(soundMeter, "ok");
    graphWrap.classList.remove("flash-ok", "flash-bad"); void graphWrap.offsetWidth; graphWrap.classList.add("flash-ok");
  }
  function pulseBad() {
    if (GK.playErrorBuzz) GK.playErrorBuzz();
    if (GK.pulseSoundMeter) GK.pulseSoundMeter(soundMeter, "bad");
    graphWrap.classList.remove("flash-ok", "flash-bad"); void graphWrap.offsetWidth; graphWrap.classList.add("flash-bad");
  }
  function drawGrid() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1;
    for (var xi = Math.ceil(XMIN); xi <= Math.floor(XMAX); xi++) {
      var p0 = worldToScreen(xi, YMIN), p1 = worldToScreen(xi, YMAX);
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
    for (var yi = Math.ceil(YMIN); yi <= Math.floor(YMAX); yi++) {
      var q0 = worldToScreen(XMIN, yi), q1 = worldToScreen(XMAX, yi);
      ctx.beginPath(); ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y); ctx.stroke();
    }
    var ox = worldToScreen(0, 0);
    ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.6; ctx.beginPath();
    ctx.moveTo(PAD.l, ox.y); ctx.lineTo(canvas.width - PAD.r, ox.y);
    if (0 >= XMIN && 0 <= XMAX) { ctx.moveTo(ox.x, PAD.t); ctx.lineTo(ox.x, canvas.height - PAD.b); }
    ctx.stroke();
    ctx.fillStyle = MUTED; ctx.font = "600 12px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (var xt = Math.ceil(XMIN); xt <= Math.floor(XMAX); xt++) {
      if (xt === 0) continue;
      var sx = worldToScreen(xt, 0);
      ctx.beginPath(); ctx.moveTo(sx.x, sx.y - 4); ctx.lineTo(sx.x, sx.y + 4); ctx.stroke();
      ctx.fillText(String(xt).replace("-", "−"), sx.x, sx.y + 8);
    }
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (var yt = Math.ceil(YMIN); yt <= Math.floor(YMAX); yt++) {
      if (yt === 0) continue;
      var sy = (0 >= XMIN && 0 <= XMAX) ? worldToScreen(0, yt) : worldToScreen(XMIN, yt);
      ctx.beginPath(); ctx.moveTo(sy.x - 4, sy.y); ctx.lineTo(sy.x + 4, sy.y); ctx.stroke();
      ctx.fillText(fmtNum(yt), sy.x - 8, sy.y);
    }
  }
  function drawWall(p) {
    var top = worldToScreen(p.xa, YMAX), bot = worldToScreen(p.xa, YMIN);
    ctx.save();
    ctx.fillStyle = "rgba(148,163,184,0.08)";
    if (p.side === "left") ctx.fillRect(top.x, PAD.t, Math.max(0, (canvas.width - PAD.r) - top.x), canvas.height - PAD.t - PAD.b);
    else ctx.fillRect(PAD.l, PAD.t, Math.max(0, top.x - PAD.l), canvas.height - PAD.t - PAD.b);
    ctx.strokeStyle = WALL; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(bot.x, bot.y); ctx.stroke();
    ctx.fillStyle = WALL; ctx.font = "700 12px ui-monospace, Menlo, monospace"; ctx.textBaseline = "top";
    if (p.side === "left") { ctx.textAlign = "right"; ctx.fillText("muro x=" + fmtNum(p.xa), top.x - 8, PAD.t + 6); }
    else { ctx.textAlign = "left"; ctx.fillText("muro x=" + fmtNum(p.xa), top.x + 8, PAD.t + 6); }
    ctx.restore();
  }
  function drawCurve(p, alpha) {
    var pts = [], steps = 220;
    for (var i = 0; i <= steps; i++) {
      var x = p.side === "left" ? (p.xa - (p.xa - XMIN) * (i / steps)) : (p.xa + (XMAX - p.xa) * (i / steps));
      var y = fSqrt(p, x);
      if (y == null || y < YMIN - 0.5 || y > YMAX + 0.5) { pts.push(null); continue; }
      pts.push(worldToScreen(x, y));
    }
    var col = p.v < 0 ? CURVE_DN : CURVE_UP;
    ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = 3.2; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath(); var first = true;
    for (var j = 0; j < pts.length; j++) {
      var q = pts[j]; if (!q) { first = true; continue; }
      if (first) { ctx.moveTo(q.x, q.y); first = false; } else ctx.lineTo(q.x, q.y);
    }
    ctx.stroke(); ctx.restore();
  }
  function drawPoint(x, y, label, color, glow) {
    var p = worldToScreen(x, y);
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); ctx.fillStyle = glow || AMBER_GLOW; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fillStyle = color || AMBER; ctx.fill();
    ctx.strokeStyle = "#fef3c7"; ctx.lineWidth = 2; ctx.stroke();
    if (label) {
      ctx.fillStyle = "#fef3c7"; ctx.font = "800 13px Segoe UI, system-ui, sans-serif"; ctx.textBaseline = "bottom";
      var lx = p.x + 12, ly = p.y - 10;
      if (lx > canvas.width - 90) lx = p.x - 12; if (ly < 22) ly = p.y + 22;
      ctx.textAlign = lx < p.x ? "right" : "left"; ctx.fillText(label, lx, ly);
    }
    ctx.restore();
  }
  function drawHover(pt) {
    if (!pt) return;
    var p = worldToScreen(pt.x, pt.y);
    ctx.save();
    ctx.strokeStyle = "rgba(255,191,0,0.7)"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,191,0,0.85)"; ctx.font = "700 12px ui-monospace, Menlo, monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText("(" + fmtNum(pt.x) + ", " + fmtNum(pt.y) + ")", p.x + 14, p.y - 12);
    ctx.restore();
  }
  function drawArrow(x0, y0, x1, y1, color) {
    var a = worldToScreen(x0, y0), b = worldToScreen(x1, y1);
    var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    var ux = dx / len, uy = dy / len, head = 11;
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x - ux * 5, b.y - uy * 5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - ux * head - uy * head * 0.45, b.y - uy * head + ux * head * 0.45);
    ctx.lineTo(b.x - ux * head + uy * head * 0.45, b.y - uy * head - ux * head * 0.45);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function showVictory(sub) {
    state.won = true; state.locked = true;
    var subEl = victoryBanner.querySelector(".sub-v");
    if (subEl && sub) subEl.textContent = sub;
    victoryBanner.classList.add("on");
    if (GK.fireConfetti) { GK.fireConfetti(confettiCanvas); later(400, function () { if (GK.fireConfetti) GK.fireConfetti(confettiCanvas); }); }
    if (GK.playExplosion) GK.playExplosion(); else if (GK.playOkChime) GK.playOkChime();
    setPrompt("¡Ganador! 20 éxitos. <strong>Seguir</strong> o <strong>Reiniciar</strong>.", "ok");
  }
  function togglePause() {
    if (state.won) return;
    state.paused = !state.paused;
    pausedBanner.classList.toggle("on", state.paused);
    pauseBtn.textContent = state.paused ? "Continuar" : "Pausar";
    pauseBtn.classList.toggle("pause-on", state.paused);
    if (state.paused) setPrompt("Pausa · tocá <strong>Continuar</strong> para seguir.", "");
  }
  function toggleSlow() {
    if (state.speedFactor === 1) { state.speedFactor = 2; slowBtn.classList.add("on"); slowBtn.setAttribute("aria-pressed", "true"); }
    else { state.speedFactor = 1; slowBtn.classList.remove("on"); slowBtn.setAttribute("aria-pressed", "false"); }
  }
  function resizeConfetti() {
    if (!confettiCanvas || !graphWrap) return;
    confettiCanvas.width = graphWrap.clientWidth || canvas.width;
    confettiCanvas.height = graphWrap.clientHeight || canvas.height;
  }
  function wireChrome(restartFn, keepFn) {
    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", restartFn);
    if (victoryRestart) victoryRestart.addEventListener("click", restartFn);
    if (victoryContinue) victoryContinue.addEventListener("click", keepFn);
    if (slowBtn) { slowBtn.addEventListener("click", toggleSlow); slowBtn.setAttribute("aria-pressed", "false"); }
    window.addEventListener("resize", function () { resizeConfetti(); if (typeof draw === "function") draw(); });
    resizeConfetti();
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function sideWord(p) { return p.side === "left" ? "izquierda" : "derecha"; }
  function oddWidth(n) { return 2 * n - 1; }
  function standardRestart(keepPlayingFn) {
    return function restart() {
      state.paused = false; pauseBtn.textContent = "Pausar"; pauseBtn.classList.remove("pause-on"); pausedBanner.classList.remove("on");
      startRound(false);
    };
  }
  function standardKeep() {
    return function keepPlaying() {
      state.won = false; state.paused = false; pauseBtn.textContent = "Pausar"; pauseBtn.classList.remove("pause-on");
      pausedBanner.classList.remove("on"); victoryBanner.classList.remove("on"); state.ok = 0; syncScores(); nextRound();
    };
  }

var state = { ok:0,bad:0,round:1,p:null,n:1,locked:false,paused:false,won:false,speedFactor:1,timers:[],reveal:false,help:false };

  function updateHelp() {
    if (!state.p) return;
    var p = state.p;
    var sign = p.side === "left" ? "−" : "+";
    helpEq.innerHTML = formulaHTML(p);
    helpBody.innerHTML =
      '<p><span class="hl-h">h = ' + fmtNum(p.h) + '</span> · unidad <strong>horizontal</strong> (ancho del 1.er peldaño). ' +
      'En la fórmula está <strong>dentro de la raíz</strong>, dividiendo: (x − xa) / <span class="hl-h">h</span>.</p>' +
      '<p><span class="hl-v">v = ' + fmtNum(p.v) + '</span> · unidad <strong>vertical</strong> (piso). ' +
      'En la fórmula es el <strong>coeficiente delante de la √</strong>: <span class="hl-v">v</span> · √(…).</p>' +
      '<p>Aterrizaje: R<sub>n</sub> = (xa ' + sign + ' n²<span class="hl-h">h</span>, yp + n·<span class="hl-v">v</span>). ' +
      'Con n=1: desde P andá <span class="hl-h">h</span> en x y <span class="hl-v">v</span> en y.</p>' +
      '<p style="margin:0">En el gráfico (con Ayuda on): flecha ámbar = <span class="hl-h">h</span>, flecha de color = <span class="hl-v">v</span>.</p>';
  }
  function toggleHelp() {
    state.help = !state.help;
    helpPanel.classList.toggle("on", state.help);
    helpBtn.classList.toggle("help-on", state.help);
    helpBtn.setAttribute("aria-expanded", state.help ? "true" : "false");
    helpBtn.textContent = state.help ? "Ayuda ✓" : "Ayuda";
    if (state.help) updateHelp();
    draw();
  }
  function drawHelpGuides() {
    if (!state.help || !state.p) return;
    var p = state.p;
    var s = p.side === "left" ? -1 : 1;
    var x1 = p.xa + s * p.h, y0 = p.yp, y1 = p.yp + p.v;
    // h horizontal
    var a = worldToScreen(p.xa, y0), b = worldToScreen(x1, y0);
    ctx.save();
    ctx.strokeStyle = RUN; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = RUN; ctx.font = "800 14px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText("h", (a.x + b.x) / 2, a.y + 8);
    // v vertical
    var c = worldToScreen(x1, y0), d = worldToScreen(x1, y1);
    ctx.strokeStyle = p.v < 0 ? RISE_DN : RISE_UP; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = p.v < 0 ? RISE_DN : RISE_UP;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText("v", c.x + 10, (c.y + d.y) / 2);
    ctx.restore();
  }

  function buildRound(){ state.p=pickParams(); state.n=1+((Math.random()*3)|0); state.reveal=false; fitWorld(state.p,Math.max(3,state.n)); }
  function correctPt(){ return landing(state.p,state.n); }
  function draw(){
    drawGrid(); drawWall(state.p); drawHelpGuides(); drawPoint(state.p.xa,state.p.yp,"P",AMBER);
    if(state.reveal){ drawCurve(state.p,0.9); var t=correctPt(); drawPoint(t.x,t.y,"R"+state.n,OK,"rgba(90,212,168,0.4)"); }
  }
  function fmtPt(pt){ return "("+fmtNum(pt.x)+", "+fmtNum(pt.y)+")"; }
  function renderChips(){
    var good=correctPt(); var s=state.p.side==="left"?-1:1;
    var opts=[good,{x:state.p.xa+s*state.n*state.p.h,y:state.p.yp+state.n*state.p.v},{x:state.p.xa+s*state.n*state.n*state.p.h,y:state.p.yp+state.n*state.n*state.p.v},landing(state.p,state.n===3?2:state.n+1),{x:good.x+1,y:good.y}];
    var seen={}; opts=opts.filter(function(pt){ var k=pt.x+","+pt.y; if(seen[k])return false; seen[k]=true; return true; });
    opts=shuffle(opts).slice(0,4); if(!opts.some(function(pt){return nearPt(pt,good,0.01);})) opts[0]=good; opts=shuffle(opts);
    var sign=state.p.side==="left"?"−":"+";
    var html='<div class="row-label">Elegí R'+state.n+' = (xa '+sign+' n²h, yp + n·v)</div><div class="chip-grid">';
    opts.forEach(function(pt,i){ html+='<button type="button" class="chip-btn" data-i="'+i+'">'+fmtPt(pt)+'</button>'; });
    html+='</div>'; chipBox.innerHTML=html;
    chipBox.querySelectorAll('.chip-btn').forEach(function(btn,i){
      btn.addEventListener('click',function(){
        if(state.paused||state.locked||state.won)return; if(GK.ensureAudio)GK.ensureAudio(); state.locked=true;
        var pt=opts[i];
        if(nearPt(pt,good,0.01)){
          btn.classList.add('correct'); state.reveal=true; state.ok++; syncScores(); pulseOk(); if(GK.fireConfetti)GK.fireConfetti(confettiCanvas);
          setPrompt('¡Bien! R'+state.n+' = <span class="hl-p">'+fmtPt(good)+'</span>.',"ok"); draw();
          if(state.ok>=WIN_AT){ later(700,function(){ showVictory("20 éxitos · raíz · dictado"); }); return; }
          later(1000,nextRound);
        } else {
          btn.classList.add('wrong'); state.bad++; syncScores(); pulseBad();
          setPrompt('No. R'+state.n+' = <span class="hl-p">'+fmtPt(good)+'</span>.',"bad");
          later(800,function(){ state.locked=false; btn.classList.remove('wrong'); });
        }
      });
    });
  }
  function startRound(keepScores){
    clearTimers(); buildRound(); state.locked=false;
    if(!keepScores){ state.ok=0; state.bad=0; state.round=1; }
    state.won=false; victoryBanner.classList.remove("on");
    exprFormula.innerHTML=formulaHTML(state.p); if(state.help) updateHelp(); sideHint.textContent="n = "+state.n+" · elegí el chip"; syncScores();
    setPrompt('Dado <strong>n='+state.n+'</strong>, elegí <span class="hl-p">R'+state.n+'</span> · rama '+sideWord(state.p)+'.',"attention");
    renderChips(); draw();
  }
  function nextRound(){ state.round++; syncScores(); startRound(true); }
  wireChrome(standardRestart(), standardKeep());
  if (helpBtn) helpBtn.addEventListener("click", function () { if (GK.ensureAudio) GK.ensureAudio(); toggleHelp(); });
  startRound(false);

})();
</script>
