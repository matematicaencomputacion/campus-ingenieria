<script>
(function () {
  "use strict";
var GK = window.CampusGameKit || {};

  var OK = "#5ad4a8", BAD = "#ff7b7b", RUN = "#60a5fa", PURPLE = "#c084fc";
  var ORIG = "#f59e0b", MIR = "#38bdf8", MIR_GLOW = "rgba(56,189,248,0.4)";
  var AXIS_GLOW = "#FFBF00", CURVE_CUB = "#f59e0b", CURVE_CBRT = "#38bdf8";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var confettiCanvas = document.getElementById("confetti");
  var graphWrap = document.getElementById("graphWrap");
  var promptEl = document.getElementById("prompt");
  var soundMeter = document.getElementById("soundMeter");
  var pauseBtn = document.getElementById("pauseBtn");
  var restartBtn = document.getElementById("restartBtn");
  var slowBtn = document.getElementById("slowBtn");
  var pausedBanner = document.getElementById("pausedBanner");
  var victoryBanner = document.getElementById("victoryBanner");
  var victoryRestart = document.getElementById("victoryRestart");
  var victoryContinue = document.getElementById("victoryContinue");
  var scoreOk = document.getElementById("scoreOk");
  var scoreBad = document.getElementById("scoreBad");
  var scoreRound = document.getElementById("scoreRound");
  var exprFormula = document.getElementById("exprFormula");
  var sideHint = document.getElementById("sideHint");
  var chipBox = document.getElementById("chipBox");
  var modeTagEl = document.getElementById("modeTag");

  /* Anisotropic lattice: wide X cells, short Y cells for y=x³ */
  var XMIN = -3.5, XMAX = 3.5, YMIN = -28, YMAX = 28;
  var PAD = { l: 52, r: 28, t: 28, b: 48 };
  var CELL_X = 82, CELL_Y = 14;
  var LABEL_Y_STEP = 1;

  function delay(ms) { return ms * (state.speedFactor || 1); }
  function clearTimers() { (state.timers || []).forEach(function (id) { clearTimeout(id); }); state.timers = []; }
  function later(ms, fn) { var id = setTimeout(fn, delay(ms)); state.timers.push(id); return id; }
  function fmtNum(n) {
    if (Object.is(n, -0) || Math.abs(n) < 1e-12) return "0";
    if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n)).replace("-", "−");
    var r = Math.round(n * 1000) / 1000;
    return String(r).replace("-", "−");
  }
  function fmtPt(pt) { return "(" + fmtNum(pt.x) + ", " + fmtNum(pt.y) + ")"; }
  function mirrorPt(pt) { return { x: pt.y, y: pt.x }; }
  function cbrt(x) { return Math.sign(x) * Math.pow(Math.abs(x), 1 / 3); }
  function cube(x) { return x * x * x; }

    return a;
  }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  function setAnisoCubic() {

    CELL_X = 82; CELL_Y = 14; LABEL_Y_STEP = 1;
    sizeCanvas();
  }
  function setAnisoCbrt() {
    XMIN = -28; XMAX = 28; YMIN = -3.5; YMAX = 3.5;

    sizeCanvas();
  }
  function setAnisoBoth() {

    XMIN = -28; XMAX = 28; YMIN = -28; YMAX = 28;
    CELL_X = 16; CELL_Y = 16; LABEL_Y_STEP = 2;
    sizeCanvas();
  }
  function fitDisplaced(p, pad) {
    pad = pad == null ? 1.2 : pad;
    var xs = [-3, -2, -1, 0, 1, 2, 3];
    var mx = 3.5, my = 4;
    for (var i = 0; i < xs.length; i++) {
      var x = p.h + p.s * xs[i];
      var y = p.v * cube(xs[i]) + p.k;
      mx = Math.max(mx, Math.abs(x) + pad);
      my = Math.max(my, Math.abs(y) + pad);
    }
    XMIN = -mx; XMAX = mx; YMIN = -my; YMAX = my;
    CELL_X = Math.max(40, Math.min(90, Math.floor(900 / (2 * mx))));
    CELL_Y = Math.max(10, Math.min(22, Math.floor(700 / (2 * my))));
    LABEL_Y_STEP = my > 20 ? 2 : 1;
    sizeCanvas();
  }
  function sizeCanvas() {
    var spanX = Math.max(0.5, XMAX - XMIN), spanY = Math.max(0.5, YMAX - YMIN);
    var w = Math.round(PAD.l + spanX * CELL_X + PAD.r);
    var hh = Math.round(PAD.t + spanY * CELL_Y + PAD.b);
    if (w > 1400 || hh > 900) {
      var sx = w > 1400 ? (1400 - PAD.l - PAD.r) / spanX : CELL_X;
      var sy = hh > 900 ? (900 - PAD.t - PAD.b) / spanY : CELL_Y;
      CELL_X = Math.max(8, Math.floor(sx));
      CELL_Y = Math.max(8, Math.floor(sy));
      w = Math.round(PAD.l + spanX * CELL_X + PAD.r);
      hh = Math.round(PAD.t + spanY * CELL_Y + PAD.b);
    }
    canvas.width = w; canvas.height = hh;
  }
  function worldToScreen(x, y) {
    var w = canvas.width - PAD.l - PAD.r, hh = canvas.height - PAD.t - PAD.b;
    return { x: PAD.l + ((x - XMIN) / (XMAX - XMIN)) * w, y: PAD.t + ((YMAX - y) / (YMAX - YMIN)) * hh };
  }
  function screenToWorld(sx, sy) {
    var w = canvas.width - PAD.l - PAD.r, hh = canvas.height - PAD.t - PAD.b;
    return { x: XMIN + ((sx - PAD.l) / w) * (XMAX - XMIN), y: YMAX - ((sy - PAD.t) / hh) * (YMAX - YMIN) };
  }
  function eventToCanvas(ev) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    var clientX = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
    var clientY = (ev.touches && ev.touches[0]) ? ev.touches[0].clientY : ev.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }
  function snapLattice(wx, wy) {
    var xi = Math.round(wx), yi = Math.round(wy);
    xi = Math.max(Math.ceil(XMIN), Math.min(Math.floor(XMAX), xi));
    yi = Math.max(Math.ceil(YMIN), Math.min(Math.floor(YMAX), yi));
    return { x: xi, y: yi };
  }
  function nearPt(a, b, tol) { tol = tol == null ? 0.35 : tol; return Math.abs(a.x - b.x) <= tol && Math.abs(a.y - b.y) <= tol; }
  function syncScores() {
    if (scoreOk) scoreOk.innerHTML = "Éxitos <strong>" + state.ok + "</strong>";
    if (scoreBad) scoreBad.innerHTML = "Errores <strong>" + state.bad + "</strong>";
    if (scoreRound) scoreRound.innerHTML = "Ronda <strong>" + state.round + "</strong>";
  }
  function setPrompt(html, cls) { if (!promptEl) return; promptEl.className = "prompt" + (cls ? (" " + cls) : ""); promptEl.innerHTML = html; }
  function pulseOk() {
    if (GK.playOkChime) GK.playOkChime();
    if (GK.pulseSoundMeter) GK.pulseSoundMeter(soundMeter, "ok");
    if (graphWrap) { graphWrap.classList.remove("flash-ok", "flash-bad"); void graphWrap.offsetWidth; graphWrap.classList.add("flash-ok"); }
  }
  function pulseBad() {
    if (GK.playErrorBuzz) GK.playErrorBuzz();
    if (GK.pulseSoundMeter) GK.pulseSoundMeter(soundMeter, "bad");
    if (graphWrap) { graphWrap.classList.remove("flash-ok", "flash-bad"); void graphWrap.offsetWidth; graphWrap.classList.add("flash-bad"); }
  }

  function fCubic(p, x) {
    var t = (x - p.h) / (p.s || 1);
    return p.v * cube(t) + p.k;
  }
  function fCbrt(p, x) {
    /* inverse of y = v*((x-h)/s)^3 + k  →  x = h + s * cbrt((y-k)/v)  but as function of x for mirrored curve */
    return p.h + (p.s || 1) * cbrt((x - p.k) / (p.v || 1));
  }
  function originParams() { return { h: 0, k: 0, v: 1, s: 1 }; }
  function latticeXs() { return [-3, -2, -1, 0, 1, 2, 3]; }
  function cubicPoints(p) {
    var xs = latticeXs(), out = [];
    var nAll = xs.length;
    for (var i = 0; i < nAll; i++) {
      var x = p.h + (p.s || 1) * xs[i];
      var y = p.v * cube(xs[i]) + p.k;
      out.push({ x: x, y: y, n: xs[i] });
    }
    return out;
  }
  function formulaCubicHTML(p) {
    var core;
    if (p.h === 0 && p.k === 0 && p.v === 1 && (p.s == null || p.s === 1)) {
      core = "x³";
    } else if ((p.s == null || p.s === 1) && p.v === 1) {
      var body = p.h === 0 ? "x³" : (p.h > 0 ? "(x − " + fmtNum(p.h) + ")³" : "(x + " + fmtNum(-p.h) + ")³");
      core = body + (p.k === 0 ? "" : (p.k > 0 ? " + " + fmtNum(p.k) : " − " + fmtNum(-p.k)));
    } else {
      var inner = p.h === 0 ? "x" : (p.h > 0 ? "x − " + fmtNum(p.h) : "x + " + fmtNum(-p.h));
      if (p.s && p.s !== 1) inner = "(" + inner + ")/" + fmtNum(p.s);
      else if (p.h !== 0) inner = "(" + inner + ")";
      var vPart = p.v === 1 ? "" : (p.v === -1 ? "−" : fmtNum(p.v) + "·");
      core = vPart + "(" + inner + ")³" + (p.k === 0 ? "" : (p.k > 0 ? " + " + fmtNum(p.k) : " − " + fmtNum(-p.k)));
    }
    return 'y = <span class="hl-cub">' + core + "</span>";
  }
  function formulaCbrtHTML(p) {
    if (p.h === 0 && p.k === 0 && p.v === 1 && (p.s == null || p.s === 1)) {
      return 'y = <span class="hl-cbrt">∛x</span>';
    }
    /* inverse sketch */
    var body = "∛((x" + (p.k === 0 ? "" : (p.k > 0 ? " − " + fmtNum(p.k) : " + " + fmtNum(-p.k))) + ")" + (p.v === 1 ? "" : "/" + fmtNum(p.v)) + ")";
    if (p.s && p.s !== 1) body = fmtNum(p.s) + "·" + body;
    if (p.h !== 0) body = body + (p.h > 0 ? " + " + fmtNum(p.h) : " − " + fmtNum(-p.h));
    return 'y = <span class="hl-cbrt">' + body + "</span> <span style=\"color:var(--muted)\">· espejo y=x</span>";
  }
  function pickDisplaced() {
    var opts = [
      { h: 1, k: 0, v: 1, s: 1 },
      { h: -1, k: 2, v: 1, s: 1 },
      { h: 0, k: -2, v: 1, s: 1 },
      { h: 2, k: -1, v: 1, s: 1 },
      { h: -2, k: 0, v: 1, s: 1 },
      { h: 1, k: 1, v: -1, s: 1 },
      { h: 0, k: 0, v: 1, s: 1 }
    ];
    return pick(opts);
  }

  function drawGrid(opts) {
    opts = opts || {};
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1;
    var xi, yi, p0, p1;
    for (xi = Math.ceil(XMIN); xi <= Math.floor(XMAX); xi++) {
      p0 = worldToScreen(xi, YMIN); p1 = worldToScreen(xi, YMAX);
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
    for (yi = Math.ceil(YMIN); yi <= Math.floor(YMAX); yi++) {
      p0 = worldToScreen(XMIN, yi); p1 = worldToScreen(XMAX, yi);
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
    var ox = worldToScreen(0, 0);
    ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (0 >= YMIN && 0 <= YMAX) { ctx.moveTo(PAD.l, ox.y); ctx.lineTo(canvas.width - PAD.r, ox.y); }
    ctx.stroke();
    ctx.beginPath();
    if (0 >= XMIN && 0 <= XMAX) { ctx.moveTo(ox.x, PAD.t); ctx.lineTo(ox.x, canvas.height - PAD.b); }
    ctx.stroke();
    if (opts.diag) {
      ctx.save();
      ctx.strokeStyle = AXIS_GLOW; ctx.lineWidth = 3;
      ctx.shadowColor = "rgba(255,191,0,0.65)"; ctx.shadowBlur = 10;
      var lo = Math.max(XMIN, YMIN), hi = Math.min(XMAX, YMAX);
      var d0 = worldToScreen(lo, lo), d1 = worldToScreen(hi, hi);
      ctx.beginPath(); ctx.moveTo(d0.x, d0.y); ctx.lineTo(d1.x, d1.y); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = AXIS_GLOW; ctx.font = "800 12px ui-monospace, Menlo, monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "bottom";
      var lab = worldToScreen(Math.min(hi - 0.4, XMAX - 0.6), Math.min(hi - 0.4, YMAX - 0.6));
      ctx.fillText("y = x · espejo", lab.x + 4, lab.y - 4);
      ctx.restore();
    }
    ctx.fillStyle = MUTED; ctx.font = "600 11px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    var xStep = (XMAX - XMIN) > 40 ? 2 : 1;
    for (var xt = Math.ceil(XMIN); xt <= Math.floor(XMAX); xt++) {
      if (xt === 0 || (xStep > 1 && xt % xStep !== 0)) continue;
      var sx = worldToScreen(xt, 0);
      if (sx.y < PAD.t || sx.y > canvas.height - PAD.b) sx = worldToScreen(xt, Math.max(YMIN, Math.min(0, YMAX)));
      ctx.strokeStyle = "#64748b";
      ctx.beginPath(); ctx.moveTo(sx.x, sx.y - 3); ctx.lineTo(sx.x, sx.y + 3); ctx.stroke();
      ctx.fillText(String(xt).replace("-", "−"), sx.x, Math.min(canvas.height - PAD.b + 6, sx.y + 7));
    }
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    var yStep = LABEL_Y_STEP || ((YMAX - YMIN) > 40 ? 2 : 1);
    for (var yt = Math.ceil(YMIN); yt <= Math.floor(YMAX); yt++) {
      if (yt === 0 || yt % yStep !== 0) continue;
      var sy = (0 >= XMIN && 0 <= XMAX) ? worldToScreen(0, yt) : worldToScreen(XMIN, yt);
      ctx.beginPath(); ctx.moveTo(sy.x - 3, sy.y); ctx.lineTo(sy.x + 3, sy.y); ctx.stroke();
      ctx.fillText(fmtNum(yt), sy.x - 7, sy.y);
    }
    /* axis labels */
    ctx.fillStyle = "#94a3b8"; ctx.font = "700 12px Segoe UI, system-ui, sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText("x", canvas.width - PAD.r - 14, Math.min(canvas.height - 22, worldToScreen(0, 0).y + 10));
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText("y", Math.max(8, worldToScreen(0, 0).x + 8), PAD.t + 14);
  }
  function drawCurveCubic(p, alpha, color) {
    var steps = 360, pts = [];
    for (var i = 0; i <= steps; i++) {
      var x = XMIN + (XMAX - XMIN) * (i / steps);
      var y = fCubic(p, x);
      if (!isFinite(y) || y < YMIN - 2 || y > YMAX + 2) { pts.push(null); continue; }
      pts.push(worldToScreen(x, y));
    }
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.strokeStyle = color || CURVE_CUB; ctx.lineWidth = 3.2; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath(); var first = true;
    var nPts = pts.length;
    for (var j = 0; j < nPts; j++) {
      var q = pts[j]; if (!q) { first = true; continue; }
      if (first) { ctx.moveTo(q.x, q.y); first = false; } else ctx.lineTo(q.x, q.y);
    }
    ctx.stroke(); ctx.restore();
  }
  function drawCurveCbrt(p, alpha, color) {
    /* Draw inverse as x = f(y) swapped: for each sample of "input" along X (cube values), y = cbrt */
    var steps = 360, pts = [];
    for (var i = 0; i <= steps; i++) {
      var x = XMIN + (XMAX - XMIN) * (i / steps);
      var y = fCbrt(p, x);
      if (!isFinite(y) || y < YMIN - 2 || y > YMAX + 2) { pts.push(null); continue; }
      pts.push(worldToScreen(x, y));
    }
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.strokeStyle = color || CURVE_CBRT; ctx.lineWidth = 3.4; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath(); var first = true;
    var nPts = pts.length;
    for (var j = 0; j < nPts; j++) {
      var q = pts[j]; if (!q) { first = true; continue; }
      if (first) { ctx.moveTo(q.x, q.y); first = false; } else ctx.lineTo(q.x, q.y);
    }
    ctx.stroke(); ctx.restore();
  }
  function drawPoint(x, y, label, color, glow) {
    var p = worldToScreen(x, y);
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI * 2); ctx.fillStyle = glow || AMBER_GLOW; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2); ctx.fillStyle = color || AMBER; ctx.fill();
    ctx.strokeStyle = "#fef3c7"; ctx.lineWidth = 1.8; ctx.stroke();
    if (label) {
      ctx.fillStyle = "#fef3c7"; ctx.font = "800 12px Segoe UI, system-ui, sans-serif"; ctx.textBaseline = "bottom";
      var lx = p.x + 10, ly = p.y - 8;
      if (lx > canvas.width - 100) lx = p.x - 10;
      if (ly < 20) ly = p.y + 20;
      ctx.textAlign = lx < p.x ? "right" : "left";
      ctx.fillText(label, lx, ly);
    }
    ctx.restore();
  }
  function drawHover(pt) {
    if (!pt) return;
    var p = worldToScreen(pt.x, pt.y);
    ctx.save();
    ctx.strokeStyle = "rgba(255,191,0,0.7)"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,191,0,0.9)"; ctx.font = "700 12px ui-monospace, Menlo, monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText("(" + fmtNum(pt.x) + ", " + fmtNum(pt.y) + ")", p.x + 14, p.y - 12);
    ctx.restore();
  }
  function drawMirrorSegment(pt) {
    var q = mirrorPt(pt);
    var a = worldToScreen(pt.x, pt.y), b = worldToScreen(q.x, q.y);
    var m = worldToScreen((pt.x + q.x) / 2, (pt.y + q.y) / 2);
    ctx.save();
    ctx.strokeStyle = "rgba(255,191,0,0.55)"; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = AXIS_GLOW; ctx.beginPath(); ctx.arc(m.x, m.y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function showVictory(sub) {
    state.won = true; state.locked = true;
    var subEl = victoryBanner && victoryBanner.querySelector(".sub-v");
    if (subEl && sub) subEl.textContent = sub;
    if (victoryBanner) victoryBanner.classList.add("on");
    if (GK.fireConfetti) { GK.fireConfetti(confettiCanvas); later(400, function () { if (GK.fireConfetti) GK.fireConfetti(confettiCanvas); }); }
    if (GK.playExplosion) GK.playExplosion(); else if (GK.playOkChime) GK.playOkChime();
    setPrompt("¡Ganador! 20 éxitos. <strong>Seguir</strong> o <strong>Reiniciar</strong>.", "ok");
  }
  function togglePause() {
    if (state.won) return;
    state.paused = !state.paused;
    if (pausedBanner) pausedBanner.classList.toggle("on", state.paused);
    if (pauseBtn) { pauseBtn.textContent = state.paused ? "Continuar" : "Pausar"; pauseBtn.classList.toggle("pause-on", state.paused); }
    if (state.paused) setPrompt("Pausa · tocá <strong>Continuar</strong> para seguir.", "");
  }
  function toggleSlow() {
    if (state.speedFactor === 1) { state.speedFactor = 2; if (slowBtn) { slowBtn.classList.add("on"); slowBtn.setAttribute("aria-pressed", "true"); } }
    else { state.speedFactor = 1; if (slowBtn) { slowBtn.classList.remove("on"); slowBtn.setAttribute("aria-pressed", "false"); } }
  }
  function resizeConfetti() {
    if (!confettiCanvas || !graphWrap) return;
    confettiCanvas.width = graphWrap.clientWidth || canvas.width;
    confettiCanvas.height = graphWrap.clientHeight || canvas.height;
  }
  function wireChrome(restartFn, keepFn) {
    if (pauseBtn) pauseBtn.addEventListener("click", togglePause);
    if (restartBtn) restartBtn.addEventListener("click", restartFn);
    if (victoryRestart) victoryRestart.addEventListener("click", restartFn);
    if (victoryContinue) victoryContinue.addEventListener("click", keepFn);
    if (slowBtn) { slowBtn.addEventListener("click", toggleSlow); slowBtn.setAttribute("aria-pressed", "false"); }
    window.addEventListener("resize", function () { resizeConfetti(); if (typeof draw === "function") draw(); });
    resizeConfetti();
  }
  function standardRestart() {
    return function restart() {
      state.paused = false;
      if (pauseBtn) { pauseBtn.textContent = "Pausar"; pauseBtn.classList.remove("pause-on"); }
      if (pausedBanner) pausedBanner.classList.remove("on");
      startRound(false);
    };
  }
  function standardKeep() {
    return function keepPlaying() {
      state.won = false; state.paused = false;
      if (pauseBtn) { pauseBtn.textContent = "Pausar"; pauseBtn.classList.remove("pause-on"); }
      if (pausedBanner) pausedBanner.classList.remove("on");
      if (victoryBanner) victoryBanner.classList.remove("on");
      state.ok = 0; syncScores(); nextRound();
    };
  }
  function successRound(msg, victorySub) {
    state.reveal = true; state.ok++; syncScores(); pulseOk();
    if (GK.fireConfetti) GK.fireConfetti(confettiCanvas);
    setPrompt(msg, "ok"); draw();
    if (state.ok >= WIN_AT) { later(700, function () { showVictory(victorySub); }); return; }
    later(1100, nextRound);
  }
  function failRound(msg) {
    state.bad++; syncScores(); pulseBad(); setPrompt(msg, "bad");
    later(900, function () { state.locked = false; if (state.placed !== undefined) state.placed = null; draw(); });
  }

var state = { ok:0,bad:0,round:1,p:null,target:null,locked:false,paused:false,won:false,speedFactor:1,timers:[],reveal:false,hover:null,placed:null };
  function buildRound(){
    state.p = pickDisplaced();
    var ns = [-2,-1,1,2,3];
    var n = pick(ns);
    var x = state.p.h + (state.p.s||1) * n;
    var y = state.p.v * cube(n) + state.p.k;
    state.target = { x: x, y: y, n: n };
    state.reveal=false; state.placed=null; state.hover=null;
    fitDisplaced(state.p, 1.5);
  }
  function draw(){
    drawGrid();
    drawPoint(state.p.h, state.p.k, "C("+fmtNum(state.p.h)+","+fmtNum(state.p.k)+")", PURPLE, "rgba(192,132,252,0.35)");
    if (state.reveal) {
      drawCurveCubic(state.p, 0.9, CURVE_CUB);
      drawPoint(state.target.x, state.target.y, fmtPt(state.target), OK, "rgba(90,212,168,0.4)");
    } else {
      drawHover(state.hover);
      if (state.placed) drawPoint(state.placed.x, state.placed.y, "", BAD, "rgba(255,123,123,0.35)");
    }
  }
  function onMove(ev){
    if (state.paused||state.locked||state.won||state.reveal) return;
    var w=screenToWorld(eventToCanvas(ev).x,eventToCanvas(ev).y);
    state.hover=snapLattice(w.x,w.y); draw();
  }
  function onClick(ev){
    if (state.paused||state.locked||state.won) return;
    if (GK.ensureAudio) GK.ensureAudio();
    var w=screenToWorld(eventToCanvas(ev).x,eventToCanvas(ev).y);
    var pt=snapLattice(w.x,w.y); state.placed=pt; state.locked=true;
    if (nearPt(pt, state.target, 0.01)) {
      successRound("¡Bien! punto desplazado "+fmtPt(state.target)+".", "20 éxitos · cúbica · desplazada");
    } else {
      failRound("Era <span class=\"hl-cub\">"+fmtPt(state.target)+"</span> · n="+fmtNum(state.target.n)+".");
    }
  }
  function startRound(keepScores){
    clearTimers(); buildRound(); state.locked=false;
    if (!keepScores){ state.ok=0; state.bad=0; state.round=1; }
    state.won=false; if (victoryBanner) victoryBanner.classList.remove("on");
    exprFormula.innerHTML = formulaCubicHTML(state.p);
    chipBox.innerHTML = '<span class="chip h">h='+fmtNum(state.p.h)+'</span><span class="chip k">k='+fmtNum(state.p.k)+'</span><span class="chip">n='+fmtNum(state.target.n)+'</span><span class="chip cub">v='+fmtNum(state.p.v)+'</span>';
    sideHint.textContent = "Colocá el aterrizaje n="+state.target.n;
    if (modeTagEl) modeTagEl.textContent = "Desplazada";
    syncScores();
    setPrompt('Cúbica desplazada · centro C(<span class="hl-h">'+fmtNum(state.p.h)+'</span>, <span class="hl-k">'+fmtNum(state.p.k)+'</span>) · colocá n=<strong>'+fmtNum(state.target.n)+'</strong>.', "attention");
    draw();
  }
  function nextRound(){ state.round++; syncScores(); startRound(true); }
  canvas.addEventListener("click", onClick); canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("touchstart", function(ev){ ev.preventDefault(); onClick(ev); }, {passive:false});
  wireChrome(standardRestart(), standardKeep()); startRound(false);

})();
</script>
</body>
