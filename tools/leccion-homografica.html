<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lección 4 Función homográfica</title>
<style>
:root {
  --bg: #0c1118; --panel: #151d2a; --ink: #e9eef7; --muted: #8b9bb4;
  --line: #ff5c5c; --point: #c084fc; --mast: #60a5fa; --ok: #34d399;
  --btn: #3b82f6; --border: #243044; --asymp: #fb7185;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
  background: radial-gradient(1200px 600px at 20% -10%, #1a2740 0%, var(--bg) 55%);
  color: var(--ink); padding: 12px 14px 18px; min-height: 100dvh;
}
.wrap { max-width: min(1400px, 100%); margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; display: inline; }
.sub {
  display: inline; margin: 0 0 0 0.55rem; color: var(--muted);
  font-size: 0.88rem; font-weight: 400;
}
.sub::before { content: "·"; margin-right: 0.55rem; opacity: 0.7; }
header > div:first-child { line-height: 1.35; }
.stage {
  display: grid; grid-template-columns: 1.55fr 0.85fr; gap: 12px;
  align-items: stretch;
}
@media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px; min-height: 0;
}
.expr {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px;
}
.expr .box { margin-right: 2px; }
.expr .toolbar {
  display: flex; flex-wrap: nowrap; gap: 6px; align-items: center;
}
.expr .toolbar button { white-space: nowrap; padding: 8px 12px; }
@media (max-width: 720px) {
  .expr .toolbar { flex-wrap: wrap; }
}
.expr .box {
  background: #0b1220; border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 1rem;
  min-width: 180px;
}
.expr .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.play {
  background: var(--btn); color: white; border: 0; border-radius: 10px;
  padding: 9px 14px; font: inherit; font-weight: 650; cursor: pointer;
}
button.ghost {
  background: transparent; color: var(--ink); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer;
}
button:disabled { opacity: 0.45; cursor: not-allowed; }
.graph-wrap { position: relative; }
.stage > .card:first-child { display: flex; flex-direction: column; }
.graph-wrap { flex: 1; display: flex; flex-direction: column; }
.graph-wrap canvas { flex: 1; min-height: 520px; max-height: min(78vh, 760px); width: 100%; object-fit: contain; }
canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: #0a0f18; }
.slider-rail {
  position: relative; height: 28px; margin-top: 6px;
  background: #0a0f18; border-radius: 8px; border: 1px solid var(--border);
}
.tri {
  position: absolute; top: 4px; width: 0; height: 0;
  border-left: 8px solid transparent; border-right: 8px solid transparent;
  border-top: 14px solid var(--mast); transform: translateX(-50%);
  filter: drop-shadow(0 0 4px rgba(96,165,250,.5));
  pointer-events: none;
}
.table-card h2, .calc-card h2 {
  margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
}
table {
  width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums;
  font-family: ui-monospace, Menlo, monospace; font-size: 0.9rem;
}
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #22304a; }
th { color: var(--muted); font-weight: 600; }
tr.new td { animation: flash 0.7s ease; }
.x-red { color: #ff5c5c; font-weight: 700; }
td.x-red { color: #ff5c5c; }
.calc-line .eq .x-red { color: #ff5c5c; font-weight: 700; }
@keyframes flash { from { background: rgba(192,132,252,.25); } to { background: transparent; } }
.calc-log {
  height: min(320px, 36vh); overflow: hidden; display: flex; flex-direction: column-reverse;
  gap: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 0.92rem;
  background: #0a0f18; border-radius: 10px; padding: 10px; border: 1px solid var(--border);
}
.calc-line {
  display: flex; justify-content: space-between; gap: 10px;
  padding: 6px 8px; border-radius: 8px; background: #121a28;
  animation: rise 0.45s ease;
}
.calc-line .eq { color: var(--muted); }
.calc-line .res { color: #93c5fd; font-weight: 650; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.narration {
  flex: 1 1 220px; margin: 0; min-width: 180px;
  color: var(--muted); font-size: 0.86rem; line-height: 1.35;
  padding: 0;
}
.narration strong { color: var(--ink); }
.right-col { display: grid; gap: 12px; align-content: start; }
.params {
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1.4fr; gap: 8px; margin: 0 0 8px;
}
@media (max-width: 1200px) { .params { grid-template-columns: 1fr 1fr 1fr; } }
@media (max-width: 700px) { .params { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .params { grid-template-columns: 1fr; } }
.param.domain .dual {
  display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center;
}
.dual-track {
  position: relative; height: 28px; touch-action: none; user-select: none;
}
.dual-track .rail {
  position: absolute; left: 0; right: 0; top: 50%; height: 6px;
  transform: translateY(-50%); border-radius: 999px; background: #243044;
}
.dual-track .fill {
  position: absolute; top: 50%; height: 6px; transform: translateY(-50%);
  border-radius: 999px; background: rgba(255,92,92,0.75); pointer-events: none;
}
.dual-track .handle {
  position: absolute; top: 50%; width: 16px; height: 16px;
  transform: translate(-50%, -50%); border-radius: 50%;
  background: #ff5c5c; border: 2px solid #fff; cursor: ew-resize;
  box-shadow: 0 0 0 3px rgba(255,92,92,0.25);
  z-index: 2;
}
.dual-track .handle:focus { outline: none; box-shadow: 0 0 0 4px rgba(96,165,250,0.45); }
.param {
  background: #0b1220; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
}
.param label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
.param .row { display: flex; align-items: center; gap: 10px; }
.param select, .param input[type=range] { flex: 1; accent-color: var(--btn); }
.param .val {
  font-family: ui-monospace, Menlo, monospace; min-width: 2.5rem; text-align: right; color: #93c5fd;
}
.badge-row {
  display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem;
  padding: 4px 10px; border-radius: 999px; background: #1e293b; color: #cbd5e1;
  font-family: ui-monospace, Menlo, monospace;
}
.badge .k { color: var(--muted); font-family: "Segoe UI", system-ui, sans-serif; font-weight: 600; }
.badge .v { color: #fcd34d; font-weight: 650; }
.badge.delta-ok .v { color: #34d399; }
.badge.delta-bad .v { color: #f87171; }
.badge.asymp .v { color: #fb7185; }
h1 .lesson-num { color: #fb7185; font-weight: 800; }

.lesson-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 6; text-decoration: none; opacity: 0.55; transition: opacity .15s;
  filter: drop-shadow(0 0 4px rgba(96,165,250,.45));
}
.lesson-nav:hover { opacity: 1; }
.lesson-nav.prev { left: 10px; }
.lesson-nav.next { right: 10px; }
.lesson-nav .chev {
  display: block; width: 0; height: 0;
  border-top: 14px solid transparent; border-bottom: 14px solid transparent;
}
.lesson-nav.prev .chev { border-right: 18px solid var(--mast); }
.lesson-nav.next .chev { border-left: 18px solid var(--mast); }

</style>
<link id="campus-lesson-shell-css" rel="stylesheet" href="lesson-shell.css">
<script src="lesson-navigation.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="lesson-num">Lección 4</span> Función homográfica</h1>
      <p class="sub">f(x)=(ax+b)/(cx+d) · asíntotas · dominio · imagen</p>
    </div>
  </header>

  <div class="card">
    <div class="params">
      <div class="param">
        <label for="coefA">Coeficiente <em>a</em></label>
        <div class="row">
          <input id="coefA" type="range" min="-3" max="3" step="0.5" value="1" />
          <span class="val" id="coefAVal">1</span>
        </div>
      </div>
      <div class="param">
        <label for="coefB">Coeficiente <em>b</em></label>
        <div class="row">
          <input id="coefB" type="range" min="-4" max="4" step="0.5" value="0" />
          <span class="val" id="coefBVal">0</span>
        </div>
      </div>
      <div class="param">
        <label for="coefC">Coeficiente <em>c</em></label>
        <div class="row">
          <input id="coefC" type="range" min="-3" max="3" step="0.5" value="1" />
          <span class="val" id="coefCVal">1</span>
        </div>
      </div>
      <div class="param">
        <label for="coefD">Coeficiente <em>d</em></label>
        <div class="row">
          <input id="coefD" type="range" min="-4" max="4" step="0.5" value="-2" />
          <span class="val" id="coefDVal">−2</span>
        </div>
      </div>
      <div class="param domain">
        <label>Restricción del dominio <em>[x₁, x₂]</em></label>
        <div class="dual">
          <span class="val" id="domLoVal">−3</span>
          <div class="dual-track" id="domTrack" role="group" aria-label="Dominio continuo">
            <div class="rail"></div>
            <div class="fill" id="domFill"></div>
            <button type="button" class="handle" id="domLoHandle" aria-label="Inicio del dominio"></button>
            <button type="button" class="handle" id="domHiHandle" aria-label="Fin del dominio"></button>
          </div>
          <span class="val" id="domHiVal">5</span>
        </div>
        <input id="domLo" type="hidden" value="-3" />
        <input id="domHi" type="hidden" value="5" />
      </div>
    </div>
    <div class="badge-row" id="badgeRow" aria-live="polite">
      <span class="badge delta-ok" id="badgeDelta"><span class="k">Δ=ad−bc</span> <span class="v">—</span></span>
      <span class="badge asymp" id="badgeVert"><span class="k">asínt. vert.</span> <span class="v">—</span></span>
      <span class="badge asymp" id="badgeHoriz"><span class="k">asínt. horiz.</span> <span class="v">—</span></span>
    </div>
    <div class="expr">
      <span class="dot" aria-hidden="true"></span>
      <div class="box" id="fnBox"><span style="color:var(--muted)">Cargar f</span></div>
      <div class="toolbar">
        <button class="ghost" id="loadBtn" type="button">Cargar f</button>
        <button class="play" id="playBtn" type="button" disabled>▶ Play tabla</button>
        <button class="ghost" id="resetBtn" type="button">Reset</button>
      </div>
      <p class="narration" id="narration">Ajustá <strong>a, b, c, d</strong>, cargá f y dale Play. Cuidado con la asíntota.</p>
    </div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="graph-wrap">
        <a class="lesson-nav prev" href="leccion-raiz-lineal.html" title="Lección 3: Raíz de una función lineal" aria-label="Lección anterior"><span class="chev" aria-hidden="true"></span></a><a class="lesson-nav next" href="leccion-logaritmo.html" title="Lección 5: Función logaritmo" aria-label="Lección siguiente"><span class="chev" aria-hidden="true"></span></a>
        <canvas id="c" width="1000" height="680" aria-label="Gráfica"></canvas>
        <div class="slider-rail" aria-hidden="true"><div class="tri" id="tri"></div></div>
      </div>
    </div>
    <div class="right-col">
      <div class="card table-card">
        <h2>Tabla de valores</h2>
        <table>
          <thead><tr><th>x</th><th>f(x)</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="card calc-card">
        <h2>Calculadora</h2>
        <div class="calc-log" id="calcLog" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  let lesson = {
    id: "custom",
    title: "Personalizada",
    latex: "f(x) = x/(x − 2)",
    a: 1, b: 0, c: 1, d: -2,
    sayLoad: "",
    sayPlay: "El mástil barre cada rama visible (salta el polo).",
  };
  const coefAEl = document.getElementById("coefA");
  const coefBEl = document.getElementById("coefB");
  const coefCEl = document.getElementById("coefC");
  const coefDEl = document.getElementById("coefD");
  const coefAVal = document.getElementById("coefAVal");
  const coefBVal = document.getElementById("coefBVal");
  const coefCVal = document.getElementById("coefCVal");
  const coefDVal = document.getElementById("coefDVal");
  const domLoEl = document.getElementById("domLo");
  const domHiEl = document.getElementById("domHi");
  const domLoVal = document.getElementById("domLoVal");
  const domHiVal = document.getElementById("domHiVal");
  const badgeDelta = document.getElementById("badgeDelta");
  const badgeVert = document.getElementById("badgeVert");
  const badgeHoriz = document.getElementById("badgeHoriz");
  const EPS = 1e-9;
  const POLE_SKIP = 0.35;

  function numLabel(n) {
    if (Number.isInteger(n)) return String(n);
    return String(Number(n.toFixed(4)));
  }
  function prettyNum(n) {
    return numLabel(n).replace(/-/g, "−");
  }
  function termLin(coef, varName) {
    const c = Number(coef);
    if (Math.abs(c) < EPS) return "";
    if (c === 1) return varName;
    if (c === -1) return "−" + varName;
    return prettyNum(c) + varName;
  }
  function latexFrom(a, b, c, d) {
    a = Number(a); b = Number(b); c = Number(c); d = Number(d);
    function poly(p, q) {
      const t1 = termLin(p, "x");
      if (Math.abs(q) < EPS) return t1 || "0";
      if (!t1) return prettyNum(q);
      return t1 + (q > 0 ? " + " : " − ") + prettyNum(Math.abs(q));
    }
    return `f(x) = (${poly(a, b)})/(${poly(c, d)})`;
  }

  function domainBounds() {
    let lo = Number(domLoEl.value);
    let hi = Number(domHiEl.value);
    if (Number.isNaN(lo)) lo = -3;
    if (Number.isNaN(hi)) hi = 5;
    if (lo > hi) { const tmp = lo; lo = hi; hi = tmp; }
    return { lo, hi };
  }

  function delta(a, b, c, d) {
    return Number(a) * Number(d) - Number(b) * Number(c);
  }

  function asymptotes(a, b, c, d) {
    a = Number(a); b = Number(b); c = Number(c); d = Number(d);
    let vert = null, horiz = null;
    if (Math.abs(c) >= EPS) {
      vert = -d / c;
      horiz = a / c;
    } else {
      // c≈0: no vertical asymptote (linear if d≠0); horizontal N/A or none
      vert = null;
      horiz = null;
    }
    return { vert, horiz };
  }

  function isHomographic(a, b, c, d) {
    return Math.abs(delta(a, b, c, d)) >= EPS;
  }

  function updateBadges() {
    const a = Number(coefAEl.value), b = Number(coefBEl.value);
    const c = Number(coefCEl.value), d = Number(coefDEl.value);
    const del = delta(a, b, c, d);
    badgeDelta.classList.remove("delta-ok", "delta-bad");
    if (Math.abs(del) < EPS) {
      badgeDelta.classList.add("delta-bad");
      badgeDelta.querySelector(".v").textContent = "0 · no es homográfica / se reduce";
    } else {
      badgeDelta.classList.add("delta-ok");
      badgeDelta.querySelector(".v").textContent = prettyNum(Number(del.toFixed(4)));
    }
    const asy = asymptotes(a, b, c, d);
    badgeVert.querySelector(".v").textContent =
      asy.vert == null ? "—" : `x = ${prettyNum(Number(asy.vert.toFixed(3)))}`;
    badgeHoriz.querySelector(".v").textContent =
      asy.horiz == null ? "—" : `y = ${prettyNum(Number(asy.horiz.toFixed(3)))}`;
  }

  function applyParamsToLesson() {
    const a = Number(coefAEl.value), b = Number(coefBEl.value);
    const c = Number(coefCEl.value), d = Number(coefDEl.value);
    const { lo, hi } = domainBounds();
    coefAVal.textContent = prettyNum(a);
    coefBVal.textContent = prettyNum(b);
    coefCVal.textContent = prettyNum(c);
    coefDVal.textContent = prettyNum(d);
    if (typeof syncDomainUI === "function") syncDomainUI();
    updateBadges();
    const asy = asymptotes(a, b, c, d);
    let sayLoad = `Armamos <strong>${latexFrom(a, b, c, d)}</strong> (ramas punteadas). Dominio previsto <strong>[${prettyNum(lo)}, ${prettyNum(hi)}]</strong>.`;
    if (!isHomographic(a, b, c, d)) {
      sayLoad += ` <strong>Atención:</strong> Δ=0 — no es homográfica (se reduce).`;
    } else if (asy.vert != null) {
      sayLoad += ` Asíntota vertical <strong>x = ${prettyNum(Number(asy.vert.toFixed(2)))}</strong>`;
      if (asy.horiz != null) sayLoad += `, horizontal <strong>y = ${prettyNum(Number(asy.horiz.toFixed(2)))}</strong>`;
      sayLoad += ".";
    }
    lesson = {
      ...lesson,
      a, b, c, d,
      domLo: lo,
      domHi: hi,
      latex: latexFrom(a, b, c, d),
      sayLoad,
      sayPlay: "El mástil barre cada rama visible y salta el polo. En cada parada: etiqueta en X → cálculo → guía a Y.",
    };
  }

  let loaded = false;
  let playing = false;
  let points = [];
  let mastX = null;
  let anim = null;
  let guide = null;
  let axisMarks = [];
  let showDomainStroke = false;
  let finalClean = false;
  let showDomainAxis = false;
  let showImageProj = false;
  let showImageAxis = false;
  let showAsympPills = false;
  let imageUnbounded = false;
  let cleanTimer = null;
  let domainAxisTimer = null;
  let imageTimer = null;
  let asympTimer = null;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const fnBox = document.getElementById("fnBox");
  const loadBtn = document.getElementById("loadBtn");
  const playBtn = document.getElementById("playBtn");
  const resetBtn = document.getElementById("resetBtn");
  const tbody = document.getElementById("tbody");
  const calcLog = document.getElementById("calcLog");
  const narration = document.getElementById("narration");
  const tri = document.getElementById("tri");

  const VIEW = 7;
  let XMIN = -VIEW, XMAX = VIEW, YMIN = -VIEW, YMAX = VIEW;

  function f(x) {
    const den = lesson.c * x + lesson.d;
    if (Math.abs(den) < EPS) return NaN;
    return (lesson.a * x + lesson.b) / den;
  }

  function poleX() {
    const asy = asymptotes(lesson.a, lesson.b, lesson.c, lesson.d);
    return asy.vert;
  }

  function fmtExpr(x) {
    const xs = x < 0 ? `(${x})` : `${x}`;
    const num = `${lesson.a}·${xs}${lesson.b >= 0 ? "+" : ""}${lesson.b}`;
    const den = `${lesson.c}·${xs}${lesson.d >= 0 ? "+" : ""}${lesson.d}`;
    return `(${num})/(${den})`;
  }

  function syncWorldToCanvas() {
    const w = canvas.width, h = canvas.height;
    const scale = Math.min(w / (2 * VIEW), h / (2 * VIEW));
    const halfW = (w / scale) / 2;
    const halfH = (h / scale) / 2;
    XMIN = -halfW; XMAX = halfW;
    YMIN = -halfH; YMAX = halfH;
    return scale;
  }

  function toCanvas(x, y) {
    const w = canvas.width, h = canvas.height;
    const scale = Math.min(w / (2 * VIEW), h / (2 * VIEW));
    const cx = w / 2, cy = h / 2;
    return [cx + x * scale, cy - y * scale];
  }
  function drawYArrow(zx, zyFrom, zyTo, color) {
    // Arrow along Y-axis from zyFrom to zyTo (canvas coords; smaller y = up)
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 7;
    ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.moveTo(zx, zyFrom);
    ctx.lineTo(zx, zyTo);
    ctx.stroke();
    // arrow head pointing toward zyTo
    const dir = zyTo < zyFrom ? -1 : 1; // -1 = toward top of canvas
    const tip = zyTo;
    const base = tip - dir * 14;
    ctx.beginPath();
    ctx.moveTo(zx, tip);
    ctx.lineTo(zx - 8, base);
    ctx.lineTo(zx + 8, base);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function xToRail(x) {
    const w = canvas.width;
    const scale = Math.min(w / (2 * VIEW), canvas.height / (2 * VIEW));
    const cx = w / 2;
    const px = cx + x * scale;
    return (px / w) * 100;
  }

  function sampleBranch(x0, x1, n) {
    const pts = [];
    if (!(x1 > x0)) return pts;
    for (let i = 0; i <= n; i++) {
      const x = x0 + (x1 - x0) * (i / n);
      const y = f(x);
      if (!Number.isFinite(y)) continue;
      pts.push({ x, y });
    }
    return pts;
  }

  function branchRanges(xLo, xHi) {
    const pole = poleX();
    if (pole == null || pole <= xLo + EPS || pole >= xHi - EPS) {
      return [[xLo, xHi]];
    }
    const gap = Math.max(POLE_SKIP * 0.4, 0.08);
    return [
      [xLo, pole - gap],
      [pole + gap, xHi],
    ].filter(([a, b]) => b > a + 1e-6);
  }

  function asymptoteInsideDomain(lo, hi) {
    const pole = poleX();
    return pole != null && pole > lo + EPS && pole < hi - EPS;
  }

  function imageOnDomain(lo, hi) {
    if (asymptoteInsideDomain(lo, hi)) {
      return { unbounded: true, min: null, max: null };
    }
    const ranges = branchRanges(lo, hi);
    const ys = [];
    for (const [a, b] of ranges) {
      const pts = sampleBranch(a, b, 80);
      for (const p of pts) {
        if (Number.isFinite(p.y) && Math.abs(p.y) < 1e6) ys.push(p.y);
      }
      const ya = f(a), yb = f(b);
      if (Number.isFinite(ya)) ys.push(ya);
      if (Number.isFinite(yb)) ys.push(yb);
    }
    if (!ys.length) return { unbounded: false, min: 0, max: 0 };
    return { unbounded: false, min: Math.min(...ys), max: Math.max(...ys) };
  }

  function drawPill(cx, cy, label, stroke, fillBg, textCol, pointer) {
    ctx.save();
    ctx.font = "700 12px ui-sans-serif, system-ui, sans-serif";
    const tw = ctx.measureText(label).width;
    const padX = 8, bh = 22;
    const bx0 = cx - tw / 2 - padX;
    const by0 = cy - bh / 2;
    const ww = tw + 2 * padX;
    const r = 6;
    ctx.fillStyle = fillBg;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx0 + r, by0);
    ctx.arcTo(bx0 + ww, by0, bx0 + ww, by0 + bh, r);
    ctx.arcTo(bx0 + ww, by0 + bh, bx0, by0 + bh, r);
    ctx.arcTo(bx0, by0 + bh, bx0, by0, r);
    ctx.arcTo(bx0, by0, bx0 + ww, by0, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    if (pointer === "down") {
      ctx.fillStyle = fillBg;
      ctx.beginPath();
      ctx.moveTo(cx - 5, by0 + bh);
      ctx.lineTo(cx + 5, by0 + bh);
      ctx.lineTo(cx, by0 + bh + 6);
      ctx.closePath();
      ctx.fill();
    } else if (pointer === "left") {
      ctx.fillStyle = fillBg;
      ctx.beginPath();
      ctx.moveTo(bx0, cy - 5);
      ctx.lineTo(bx0, cy + 5);
      ctx.lineTo(bx0 - 6, cy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = textCol;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, cx, by0 + bh / 2);
    ctx.restore();
  }

    function strokePolyline(pts, style) {
    if (!pts || pts.length < 2) return;
    ctx.save();
    if (style) {
      if (style.strokeStyle != null) ctx.strokeStyle = style.strokeStyle;
      if (style.lineWidth != null) ctx.lineWidth = style.lineWidth;
      if (style.lineCap != null) ctx.lineCap = style.lineCap;
      if (style.lineJoin != null) ctx.lineJoin = style.lineJoin;
      if (style.globalAlpha != null) ctx.globalAlpha = style.globalAlpha;
      if (Array.isArray(style.dash)) ctx.setLineDash(style.dash);
    }
    ctx.beginPath();
    let started = false, prevY = null;
    for (const p of pts) {
      if (!Number.isFinite(p.y)) { started = false; prevY = null; continue; }
      if (prevY != null && Math.abs(p.y - prevY) > 40) started = false;
      const [px, py] = toCanvas(p.x, p.y);
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
      prevY = p.y;
    }
    ctx.stroke();
    if (Array.isArray(style && style.dash)) ctx.setLineDash([]);
    ctx.restore();
  }

  function draw() {
    syncWorldToCanvas();
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#1c2738"; ctx.lineWidth = 1;
    for (let x = Math.ceil(XMIN); x <= XMAX; x++) {
      const [px] = toCanvas(x, 0);
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
    }
    for (let y = Math.ceil(YMIN); y <= YMAX; y++) {
      const [, py] = toCanvas(0, y);
      ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
    }
    ctx.strokeStyle = "#4b5d7a"; ctx.lineWidth = 1.5;
    const [ox, oy] = toCanvas(0, 0);
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();

    const asy = asymptotes(lesson.a, lesson.b, lesson.c, lesson.d);

    if (loaded) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
      const { lo, hi } = domainBounds();

      // Asymptote guides after Cargar f
      if (asy.vert != null && asy.vert >= XMIN && asy.vert <= XMAX) {
        const [vx] = toCanvas(asy.vert, 0);
        ctx.save();
        ctx.strokeStyle = showAsympPills ? "rgba(251,113,133,0.95)" : "rgba(251,113,133,0.55)";
        ctx.lineWidth = showAsympPills ? 2.5 : 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(vx, 0);
        ctx.lineTo(vx, h);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
      if (asy.horiz != null && asy.horiz >= YMIN && asy.horiz <= YMAX) {
        const [, hy] = toCanvas(0, asy.horiz);
        ctx.save();
        ctx.strokeStyle = showAsympPills ? "rgba(251,113,133,0.95)" : "rgba(251,113,133,0.45)";
        ctx.lineWidth = showAsympPills ? 2.5 : 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(0, hy);
        ctx.lineTo(w, hy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      if (!finalClean) {
        const ranges = branchRanges(XMIN, XMAX);
        for (const [a, b] of ranges) {
          const pts = sampleBranch(a, b, 160);
          ctx.save();
          ctx.strokeStyle = "rgba(255,92,92,0.85)";
          ctx.lineWidth = 2;
          ctx.setLineDash([7, 6]);
          ctx.beginPath();
          let started = false, prevY = null;
          for (const p of pts) {
            if (!Number.isFinite(p.y)) { started = false; prevY = null; continue; }
            if (prevY != null && Math.abs(p.y - prevY) > 40) started = false;
            const [px, py] = toCanvas(p.x, p.y);
            if (!started) { ctx.moveTo(px, py); started = true; }
            else ctx.lineTo(px, py);
            prevY = p.y;
          }
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }
      }

      if (showDomainStroke) {
        const xA = Math.max(lo, XMIN);
        const xB = Math.min(hi, XMAX);
        const ranges = branchRanges(xA, xB);
        for (const [a, b] of ranges) {
          const pts = sampleBranch(a, b, 120);
          ctx.save();
          ctx.strokeStyle = "#ff5c5c";
          ctx.lineWidth = 4.5;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          let started = false, prevY = null;
          for (const p of pts) {
            if (!Number.isFinite(p.y)) { started = false; prevY = null; continue; }
            if (prevY != null && Math.abs(p.y - prevY) > 40) started = false;
            const [px, py] = toCanvas(p.x, p.y);
            if (!started) { ctx.moveTo(px, py); started = true; }
            else ctx.lineTo(px, py);
            prevY = p.y;
          }
          ctx.stroke();
          ctx.restore();
        }

        // soft shade excluding pole gap
        for (const [a, b] of ranges) {
          const [ax] = toCanvas(a, 0);
          const [bx] = toCanvas(b, 0);
          ctx.fillStyle = "rgba(255,92,92,0.07)";
          ctx.fillRect(Math.min(ax, bx), 0, Math.abs(bx - ax), h);
        }

        function domainFence(xBound) {
          const yBound = f(xBound);
          if (!Number.isFinite(yBound)) return;
          const [px0, py0] = toCanvas(xBound, 0);
          const [px1, py1] = toCanvas(xBound, yBound);
          ctx.save();
          ctx.strokeStyle = "rgba(255,92,92,0.95)";
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(px0, py0);
          ctx.lineTo(px1, py1);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "#ff5c5c";
          ctx.beginPath(); ctx.arc(px0, py0, 4, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(px1, py1, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.font = "700 12px ui-monospace, Menlo, sans-serif";
          ctx.fillStyle = "#ff5c5c";
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          ctx.fillText(prettyNum(xBound), px0, py0 + 8);
          ctx.restore();
        }
        domainFence(xA);
        domainFence(xB);
      }
      ctx.restore();
    }

    function drawSoftDash(x0, y0, x1, y1, color) {
      const [a, b] = toCanvas(x0, y0);
      const [c, d] = toCanvas(x1, y1);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 5]);
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    function labelX(x) {
      const [px, py] = toCanvas(x, 0);
      ctx.save();
      ctx.font = "700 13px ui-monospace, Menlo, sans-serif";
      ctx.fillStyle = "#ff5c5c";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText(prettyNum(x), px, py + 8);
      ctx.restore();
    }
    function labelY(y) {
      const [px, py] = toCanvas(0, y);
      ctx.save();
      ctx.font = "600 13px ui-monospace, Menlo, sans-serif";
      ctx.fillStyle = "#c4b5fd";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(prettyNum(Number(y.toFixed(2))), px - 10, py);
      ctx.restore();
    }

    if (!finalClean) {
      for (const p of axisMarks) {
        drawSoftDash(p.x, 0, p.x, p.y, "rgba(192,132,252,0.35)");
        drawSoftDash(0, p.y, p.x, p.y, "rgba(192,132,252,0.35)");
        labelX(p.x);
        labelY(p.y);
      }

      if (guide) {
        if (guide.phase === "x" || guide.phase === "xy") {
          const [px, py] = toCanvas(guide.x, 0);
          ctx.save();
          ctx.strokeStyle = "rgba(96,165,250,0.9)";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(px, py - 6); ctx.lineTo(px, py + 6); ctx.stroke();
          ctx.restore();
          labelX(guide.x);
        }
        if (guide.phase === "xy") {
          drawSoftDash(guide.x, 0, guide.x, guide.y, "rgba(96,165,250,0.75)");
          drawSoftDash(0, guide.y, guide.x, guide.y, "rgba(192,132,252,0.85)");
          labelY(guide.y);
        }
      }

      if (mastX !== null) {
        const [mx] = toCanvas(mastX, 0);
        ctx.strokeStyle = "rgba(96,165,250,0.55)"; ctx.lineWidth = 1.25;
        ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, h); ctx.stroke();
        const y = f(mastX);
        if (Number.isFinite(y) && y >= YMIN && y <= YMAX) {
          const [, my] = toCanvas(mastX, y);
          ctx.fillStyle = "rgba(96,165,250,0.3)";
          ctx.beginPath(); ctx.arc(mx, my, 10, 0, Math.PI * 2); ctx.fill();
        }
      }

      for (const p of points) {
        const [px, py] = toCanvas(p.x, p.y);
        ctx.fillStyle = "#c084fc";
        ctx.beginPath(); ctx.arc(px, py, 6.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      }
    }

    // Yellow domain — split if pole inside
    if (showDomainAxis && showDomainStroke) {
      const { lo, hi } = domainBounds();
      const xA = Math.max(lo, XMIN);
      const xB = Math.min(hi, XMAX);
      const ranges = branchRanges(xA, xB);
      ctx.save();
      for (const [a, b] of ranges) {
        if (!(b > a)) continue;
        const [ax, ay] = toCanvas(a, 0);
        const [bx] = toCanvas(b, 0);
        ctx.strokeStyle = "#f5c542";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, ay);
        ctx.stroke();
        ctx.fillStyle = "#f5c542";
        ctx.beginPath(); ctx.arc(ax, ay, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(bx, ay, 5, 0, Math.PI * 2); ctx.fill();
      }
      // single dominio pill at mid of overall interval
      if (ranges.length) {
        const mid = (xA + xB) / 2;
        const [mx, my] = toCanvas(mid, 0);
        drawPill(mx, my - 28, ranges.length > 1 ? "dominio (agujero)" : "dominio", "#f5c542", "rgba(20, 16, 8, 0.92)", "#f5c542", "down");
      }
      ctx.restore();
    }

    // Green image when bounded
    if ((showImageProj || showImageAxis) && showDomainStroke && !imageUnbounded) {
      const { lo, hi } = domainBounds();
      const xA = Math.max(lo, XMIN);
      const xB = Math.min(hi, XMAX);
      const yA = f(xA), yB = f(xB);
      const ends = [];
      if (Number.isFinite(yA)) ends.push({ x: xA, y: yA });
      if (Number.isFinite(yB)) ends.push({ x: xB, y: yB });
      if (showImageProj) {
        for (const e of ends) {
          const [px, py] = toCanvas(e.x, e.y);
          const [zx, zy] = toCanvas(0, e.y);
          ctx.save();
          ctx.strokeStyle = "rgba(52, 211, 153, 0.95)";
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 5]);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(zx, zy);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "#34d399";
          ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(zx, zy, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.font = "700 12px ui-monospace, Menlo, sans-serif";
          ctx.fillStyle = "#34d399";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(prettyNum(Number(e.y.toFixed(2))), zx + 10, zy);
          ctx.restore();
        }
      }
      if (showImageAxis) {
        const img = imageOnDomain(lo, hi);
        if (!img.unbounded && img.min != null) {
          const yLo = img.min, yHi = img.max;
          const y0 = Math.max(yLo, YMIN);
          const y1 = Math.min(yHi, YMAX);
          if (y1 > y0 || Math.abs(yHi - yLo) < 1e-9) {
            const drawLo = Math.abs(yHi - yLo) < 1e-9 ? yLo : y0;
            const drawHi = Math.abs(yHi - yLo) < 1e-9 ? yHi : y1;
            const [zx0, zy0] = toCanvas(0, drawLo);
            const [, zy1] = toCanvas(0, drawHi);
            ctx.save();
            ctx.strokeStyle = "#34d399";
            ctx.lineWidth = 8;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(zx0, zy0);
            ctx.lineTo(zx0, zy1);
            ctx.stroke();
            ctx.fillStyle = "#34d399";
            ctx.beginPath(); ctx.arc(zx0, zy0, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(zx0, zy1, 5, 0, Math.PI * 2); ctx.fill();
            const my = (zy0 + zy1) / 2;
            const label = "imagen";
            ctx.font = "700 13px ui-sans-serif, system-ui, sans-serif";
            const tw = ctx.measureText(label).width;
            const padX = 8, bh = 22;
            const bx0 = zx0 - tw - 2 * padX - 18;
            const by0 = my - bh / 2;
            ctx.fillStyle = "rgba(8, 20, 16, 0.92)";
            ctx.strokeStyle = "#34d399";
            ctx.lineWidth = 1.5;
            const r = 6;
            const ww = tw + 2 * padX;
            ctx.beginPath();
            ctx.moveTo(bx0 + r, by0);
            ctx.arcTo(bx0 + ww, by0, bx0 + ww, by0 + bh, r);
            ctx.arcTo(bx0 + ww, by0 + bh, bx0, by0 + bh, r);
            ctx.arcTo(bx0, by0 + bh, bx0, by0, r);
            ctx.arcTo(bx0, by0, bx0 + ww, by0, r);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "#34d399";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, bx0 + ww / 2, my);
            ctx.restore();
          }
        }
      }
    }

    // Unbounded image: two green rays on Y with arrow tips, gap at horizontal asymptote
    if (showImageAxis && showDomainStroke && imageUnbounded) {
      const [zx] = toCanvas(0, 0);
      const gap = 14; // px hole around horizontal asymptote
      let hy = null;
      if (asy.horiz != null && Number.isFinite(asy.horiz)) {
        const [, hyCanvas] = toCanvas(0, asy.horiz);
        hy = hyCanvas;
      }
      ctx.save();
      // upper ray (toward +∞ / top of canvas = smaller pixel y)
      const topY = 18;
      const botY = h - 18;
      if (hy == null) {
        // no horizontal asymptote: one ray up and one down from mid? still show full with arrows both ways
        drawYArrow(zx, (topY + botY) / 2, topY, "#34d399");
        drawYArrow(zx, (topY + botY) / 2, botY, "#34d399");
      } else {
        // ray above asymptote (toward top) and below (toward bottom)
        const fromAbove = hy - gap;
        const fromBelow = hy + gap;
        if (fromAbove > topY + 20) drawYArrow(zx, fromAbove, topY, "#34d399");
        if (fromBelow < botY - 20) drawYArrow(zx, fromBelow, botY, "#34d399");
        // hollow marker at excluded horizontal asymptote
        ctx.strokeStyle = "#fb7185";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(zx, hy, 6, 0, Math.PI * 2);
        ctx.stroke();
      }
      // pill
      const label = "imagen (no acotada)";
      ctx.font = "700 12px ui-sans-serif, system-ui, sans-serif";
      const tw = ctx.measureText(label).width;
      const padX = 8, bh = 22;
      const bx0 = zx - tw - 2 * padX - 22;
      const my = hy != null ? hy : h / 2;
      const by0 = my - bh / 2;
      ctx.fillStyle = "rgba(8, 20, 16, 0.92)";
      ctx.strokeStyle = "#34d399";
      ctx.lineWidth = 1.5;
      const r = 6;
      const ww = tw + 2 * padX;
      ctx.beginPath();
      ctx.moveTo(bx0 + r, by0);
      ctx.arcTo(bx0 + ww, by0, bx0 + ww, by0 + bh, r);
      ctx.arcTo(bx0 + ww, by0 + bh, bx0, by0 + bh, r);
      ctx.arcTo(bx0, by0 + bh, bx0, by0, r);
      ctx.arcTo(bx0, by0, bx0 + ww, by0, r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#34d399";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, bx0 + ww / 2, my);
      ctx.restore();
    }

    // Asymptote pills surprise
    if (showAsympPills && loaded) {
      if (asy.vert != null && asy.vert >= XMIN && asy.vert <= XMAX) {
        const [vx, vy] = toCanvas(asy.vert, 0);
        drawPill(vx + 70, 36, "asíntota vertical", "#fb7185", "rgba(30, 10, 16, 0.94)", "#fb7185", null);
      }
      if (asy.horiz != null && asy.horiz >= YMIN && asy.horiz <= YMAX) {
        const [hx, hy] = toCanvas(0, asy.horiz);
        drawPill(w - 100, hy, "asíntota horizontal", "#fb7185", "rgba(30, 10, 16, 0.94)", "#fb7185", "left");
      }
    }

    const xs0 = visibleXs();
    tri.style.left = (mastX === null ? xToRail(xs0[0] ?? 0) : xToRail(mastX)) + "%";
  }

  function visibleXs() {
    syncWorldToCanvas();
    const out = [];
    const pole = poleX();
    const x0 = Math.ceil(XMIN + 1e-9);
    const x1 = Math.floor(XMAX - 1e-9);
    for (let x = x0; x <= x1; x++) {
      if (pole != null && Math.abs(x - pole) < POLE_SKIP) continue;
      const y = f(x);
      if (!Number.isFinite(y)) continue;
      if (y >= YMIN && y <= YMAX) out.push(x);
    }
    if (out.length <= 11) return out;
    const step = Math.ceil(out.length / 11);
    return out.filter((_, i) => i % step === 0);
  }

  function setNarration(html) { narration.innerHTML = html; }

  function clearOutputs() {
    points = [];
    tbody.innerHTML = "";
    calcLog.innerHTML = "";
    mastX = null;
    guide = null;
    axisMarks = [];
    showDomainStroke = false;
    finalClean = false;
    showDomainAxis = false;
    showImageProj = false;
    showImageAxis = false;
    showAsympPills = false;
    imageUnbounded = false;
    if (cleanTimer) { clearTimeout(cleanTimer); cleanTimer = null; }
    if (domainAxisTimer) { clearTimeout(domainAxisTimer); domainAxisTimer = null; }
    if (imageTimer) { clearTimeout(imageTimer); imageTimer = null; }
    if (asympTimer) { clearTimeout(asympTimer); asympTimer = null; }
  }

  function loadFn() {
    cancelAnim();
    applyParamsToLesson();
    loaded = true;
    clearOutputs();
    fnBox.textContent = lesson.latex;
    playBtn.disabled = false;
    setNarration(lesson.sayLoad);
    const xs = visibleXs();
    mastX = xs.length ? xs[0] : 0;
    draw();
  }

  function fmtExprHtml(x) {
    const xs = `<span class="x-red">${x < 0 ? `(${x})` : `${x}`}</span>`;
    const num = `${lesson.a}·${xs}${lesson.b >= 0 ? " + " : " − "}${Math.abs(lesson.b)}`;
    const den = `${lesson.c}·${xs}${lesson.d >= 0 ? " + " : " − "}${Math.abs(lesson.d)}`;
    return `(${num})/(${den})`;
  }

  function addCalc(x, y) {
    const line = document.createElement("div");
    line.className = "calc-line";
    const yShow = Number.isInteger(y) ? y : Number(y.toFixed(4));
    line.innerHTML = `<span class="eq">${fmtExprHtml(x)}</span><span class="res">= ${yShow}</span>`;
    calcLog.prepend(line);
    while (calcLog.children.length > 8) calcLog.removeChild(calcLog.lastChild);
  }

  function addRow(x, y) {
    const tr = document.createElement("tr");
    tr.className = "new";
    const yShow = Number.isInteger(y) ? y : Number(y.toFixed(4));
    tr.innerHTML = `<td class="x-red">${x}</td><td>${yShow}</td>`;
    tbody.appendChild(tr);
  }

  function cancelAnim() {
    playing = false;
    if (anim) cancelAnimationFrame(anim);
    anim = null;
  }

  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  function animateTo(from, to, ms) {
    return new Promise((resolve) => {
      const pole = poleX();
      // refuse to animate across the pole
      if (pole != null) {
        const lo = Math.min(from, to), hi = Math.max(from, to);
        if (pole > lo + EPS && pole < hi - EPS) {
          mastX = to;
          draw();
          return resolve(true);
        }
      }
      const t0 = performance.now();
      const step = (now) => {
        if (!playing) return resolve(false);
        const u = Math.min(1, (now - t0) / ms);
        mastX = from + (to - from) * easeInOut(u);
        draw();
        if (u < 1) anim = requestAnimationFrame(step);
        else resolve(true);
      };
      anim = requestAnimationFrame(step);
    });
  }

  function wait(ms) {
    return new Promise((r) => {
      setTimeout(() => r(playing), ms);
    });
  }

  async function playTable() {
    if (!loaded || playing) return;
    playing = true;
    playBtn.disabled = true;
    loadBtn.disabled = true;
    clearOutputs();
    setNarration(lesson.sayPlay);
    const xs = visibleXs();
    if (!xs.length) {
      setNarration("No hay enteros x visibles lejos del polo con f(x) en el gráfico. Probá otros valores o el dominio.");
      playing = false;
      playBtn.disabled = false;
      loadBtn.disabled = false;
      return;
    }
    mastX = xs[0];
    draw();
    const pole = poleX();

    for (let i = 0; i < xs.length; i++) {
      if (!playing) break;
      const x = xs[i];
      if (i > 0) {
        guide = null;
        const prev = xs[i - 1];
        const crosses = pole != null && ((prev < pole && x > pole) || (prev > pole && x < pole));
        if (crosses) {
          setNarration(`Saltamos la <strong>asíntota vertical</strong> (polo en x = ${prettyNum(Number(pole.toFixed(2)))}). Seguimos en la otra rama.`);
          await wait(700);
          if (!playing) break;
          mastX = x;
          draw();
        } else {
          const ok = await animateTo(prev, x, 900);
          if (!ok) break;
        }
      }
      const y = f(x);
      if (!Number.isFinite(y)) continue;
      mastX = x;
      guide = { x, phase: "x" };
      draw();
      setNarration(`Tomamos <strong>x = ${x}</strong> sobre el eje X (lejos del polo).`);
      await wait(550);
      if (!playing) break;
      addCalc(x, y);
      const yShow = Number.isInteger(y) ? y : Number(y.toFixed(4));
      setNarration(`Calculamos <strong>${fmtExpr(x)} = ${yShow}</strong>.`);
      await wait(450);
      if (!playing) break;
      guide = { x, y, phase: "xy" };
      addRow(x, y);
      points.push({ x, y });
      axisMarks.push({ x, y });
      draw();
      setNarration(`Proyectamos hasta <strong>y = ${yShow}</strong> y marcamos <strong>(${x}, ${yShow})</strong>.`);
      await wait(700);
    }
    guide = null;
    if (playing) {
      showDomainStroke = true;
      finalClean = false;
      if (cleanTimer) clearTimeout(cleanTimer);
      draw();
      const { lo, hi } = domainBounds();
      const split = asymptoteInsideDomain(lo, hi);
      setNarration(split
        ? `Tabla completa. Trazo grueso en las <strong>dos ramas</strong> del dominio (agujero en el polo). En 4 s quitamos andamios.`
        : `Tabla completa. Resaltamos el trazo en el dominio <strong>[${prettyNum(lo)}, ${prettyNum(hi)}]</strong>. En 4 s quitamos los andamios.`);
      cleanTimer = setTimeout(() => {
        finalClean = true;
        mastX = null;
        guide = null;
        showDomainAxis = true;
        if (domainAxisTimer) clearTimeout(domainAxisTimer);
        draw();
        setNarration(split
          ? `Proyectamos el <strong>dominio</strong> (partido por la asíntota) sobre el eje X.`
          : `Proyectamos el <strong>dominio</strong> sobre el eje X: <strong>[${prettyNum(lo)}, ${prettyNum(hi)}]</strong>.`);
        domainAxisTimer = setTimeout(() => {
          showDomainAxis = false;
          const img = imageOnDomain(lo, hi);
          imageUnbounded = img.unbounded;
          if (imageTimer) clearTimeout(imageTimer);
          if (img.unbounded) {
            showImageProj = false;
            showImageAxis = true; // rays with arrowheads, gap at horizontal asymptote
            draw();
            setNarration(`La <strong>imagen no está acotada</strong>: rayos verdes hacia ±∞, excepto la asíntota horizontal.`);
            imageTimer = setTimeout(() => {
              showImageAxis = false;
              showAsympPills = true;
              draw();
              setNarration(`★ Asíntotas: vertical e horizontal resaltadas.`);
              if (asympTimer) clearTimeout(asympTimer);
              asympTimer = setTimeout(() => {
                showAsympPills = false;
                draw();
                setNarration(`Construcción final: ramas de f en el dominio (con agujero en el polo).`);
              }, 4000);
            }, 4500);
          } else {
            showImageProj = true;
            showImageAxis = false;
            draw();
            setNarration(`Proyectamos en verde los extremos hasta el eje Y.`);
            imageTimer = setTimeout(() => {
              showImageAxis = true;
              draw();
              setNarration(`La <strong>imagen</strong>: <strong>[${prettyNum(Number(img.min.toFixed(2)))}, ${prettyNum(Number(img.max.toFixed(2)))}]</strong>.`);
              imageTimer = setTimeout(() => {
                showImageProj = false;
                showImageAxis = false;
                showAsympPills = true;
                draw();
                setNarration(`★ Asíntotas: vertical e horizontal resaltadas.`);
                if (asympTimer) clearTimeout(asympTimer);
                asympTimer = setTimeout(() => {
                  showAsympPills = false;
                  draw();
                  setNarration(`Construcción final: trazo de f en el dominio <strong>[${prettyNum(lo)}, ${prettyNum(hi)}]</strong>.`);
                }, 4000);
              }, 4000);
            }, 2500);
          }
        }, 4000);
      }, 4000);
    } else {
      draw();
    }
    playing = false;
    playBtn.disabled = false;
    loadBtn.disabled = false;
  }

  function resetAll() {
    cancelAnim();
    loaded = false;
    clearOutputs();
    fnBox.innerHTML = '<span style="color:var(--muted)">Cargar f</span>';
    playBtn.disabled = true;
    loadBtn.disabled = false;
    setNarration("Reset. Ajustá <strong>a, b, c, d</strong>, cargá f y dale Play.");
    draw();
  }

  function onParamInput() {
    applyParamsToLesson();
    if (loaded && !playing) {
      fnBox.textContent = lesson.latex;
      clearOutputs();
      const xs = visibleXs();
      mastX = xs.length ? xs[0] : 0;
      setNarration(lesson.sayLoad + " Tocá <strong>Play tabla</strong> para recorrerla.");
      draw();
    } else if (!loaded) {
      fnBox.innerHTML = `<span style="color:var(--muted)">${lesson.latex}</span>`;
    }
  }

  const DOM_MIN = -7, DOM_MAX = 7;
  const domTrack = document.getElementById("domTrack");
  const domFill = document.getElementById("domFill");
  const domLoHandle = document.getElementById("domLoHandle");
  const domHiHandle = document.getElementById("domHiHandle");

  function domainToPct(v) {
    return ((v - DOM_MIN) / (DOM_MAX - DOM_MIN)) * 100;
  }
  function pctToDomain(pct) {
    const raw = DOM_MIN + (pct / 100) * (DOM_MAX - DOM_MIN);
    return Math.round(raw * 2) / 2;
  }
  function syncDomainUI() {
    let lo = Number(domLoEl.value), hi = Number(domHiEl.value);
    if (lo > hi) { const t = lo; lo = hi; hi = t; }
    domLoEl.value = String(lo);
    domHiEl.value = String(hi);
    domLoHandle.style.left = domainToPct(lo) + "%";
    domHiHandle.style.left = domainToPct(hi) + "%";
    domFill.style.left = domainToPct(lo) + "%";
    domFill.style.width = (domainToPct(hi) - domainToPct(lo)) + "%";
    domLoVal.textContent = prettyNum(lo);
    domHiVal.textContent = prettyNum(hi);
  }

  function bindHandle(handle, which) {
    const onMove = (clientX) => {
      const rect = domTrack.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      let v = pctToDomain(pct);
      let lo = Number(domLoEl.value), hi = Number(domHiEl.value);
      if (which === "lo") {
        lo = Math.min(v, hi);
        domLoEl.value = String(lo);
      } else {
        hi = Math.max(v, lo);
        domHiEl.value = String(hi);
      }
      syncDomainUI();
      onParamInput();
    };
    handle.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      onMove(e.clientX);
      const move = (ev) => onMove(ev.clientX);
      const up = () => {
        handle.releasePointerCapture(e.pointerId);
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
    });
  }
  bindHandle(domLoHandle, "lo");
  bindHandle(domHiHandle, "hi");
  domTrack.addEventListener("pointerdown", (e) => {
    if (e.target.classList.contains("handle")) return;
    const rect = domTrack.getBoundingClientRect();
    const v = pctToDomain(((e.clientX - rect.left) / rect.width) * 100);
    const lo = Number(domLoEl.value), hi = Number(domHiEl.value);
    if (Math.abs(v - lo) <= Math.abs(v - hi)) {
      domLoEl.value = String(Math.min(v, hi));
    } else {
      domHiEl.value = String(Math.max(v, lo));
    }
    syncDomainUI();
    onParamInput();
  });

  coefAEl.addEventListener("input", onParamInput);
  coefBEl.addEventListener("input", onParamInput);
  coefCEl.addEventListener("input", onParamInput);
  coefDEl.addEventListener("input", onParamInput);

  loadBtn.addEventListener("click", loadFn);
  playBtn.addEventListener("click", playTable);
  resetBtn.addEventListener("click", resetAll);

  applyParamsToLesson();
  syncDomainUI();
  draw();
})();
</script>
<script src="lesson-bar.js" defer></script>
</body>
