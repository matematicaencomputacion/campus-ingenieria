var GK = window.CampusGameKit || {};
  var AMBER = "#f59e0b", AMBER_GLOW = "rgba(245,158,11,0.4)", MUTED = "#8b9bb4";
  var MIR = "#38bdf8", MIR_GLOW = "rgba(56,189,248,0.4)", PURPLE = "#c084fc";
  var AXIS_GLOW = "#FFBF00", CURVE_CUB = "#f59e0b", CURVE_CBRT = "#38bdf8";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var playBtn = document.getElementById("playBtn");
  var stopBtn = document.getElementById("stopBtn");
  var slowBtn = document.getElementById("slowBtn");
  var restartBtn = document.getElementById("restartBtn");
  var loopEl = document.getElementById("loopEl");
  var captionEl = document.getElementById("caption");
  var workPanel = document.getElementById("workPanel");
  var exprFormula = document.getElementById("exprFormula");
  var exprMirror = document.getElementById("exprMirror");
  var chipBox = document.getElementById("chipBox");
  var soundMeter = document.getElementById("soundMeter");

  var XMIN=-3.5,XMAX=3.5,YMIN=-28,YMAX=28;
  var PAD={l:52,r:28,t:28,b:48}, CELL_X=82, CELL_Y=14, LABEL_Y_STEP=1;
  var state = { playing:false, loop:0, speedFactor:1, timers:[], phase:"idle", shown:[], showCurve:false, showMirror:false, showCbrt:false, diag:false };

  function delay(ms){ return ms*(state.speedFactor||1); }
  function clearTimers(){ state.timers.forEach(function(id){ clearTimeout(id); }); state.timers=[]; }
  function later(ms,fn){ var id=setTimeout(fn,delay(ms)); state.timers.push(id); return id; }
  function fmtNum(n){ if(Object.is(n,-0)||Math.abs(n)<1e-12)return "0"; if(Math.abs(n-Math.round(n))<1e-9)return String(Math.round(n)).replace("-","−"); return String(Math.round(n*1000)/1000).replace("-","−"); }
  function fmtPt(pt){ return "("+fmtNum(pt.x)+", "+fmtNum(pt.y)+")"; }
  function cube(x){ return x*x*x; }
  function cbrt(x){ return Math.sign(x)*Math.pow(Math.abs(x),1/3); }
  function mirrorPt(pt){ return {x:pt.y,y:pt.x}; }
  function setCaption(html){ captionEl.innerHTML=html; }
  function setWork(html){ if(!html){ workPanel.classList.remove("on"); workPanel.innerHTML=""; return; } workPanel.classList.add("on"); workPanel.innerHTML=html; }
  function bip(){ if(GK.playOkChime)GK.playOkChime(); if(GK.pulseSoundMeter)GK.pulseSoundMeter(soundMeter,"ok"); }

  function sizeCanvas(){
    var spanX=Math.max(0.5,XMAX-XMIN), spanY=Math.max(0.5,YMAX-YMIN);
    var w=Math.round(PAD.l+spanX*CELL_X+PAD.r), hh=Math.round(PAD.t+spanY*CELL_Y+PAD.b);
    if(w>1400||hh>900){ CELL_X=Math.max(8,Math.floor((1400-PAD.l-PAD.r)/spanX)); CELL_Y=Math.max(8,Math.floor((900-PAD.t-PAD.b)/spanY)); w=Math.round(PAD.l+spanX*CELL_X+PAD.r); hh=Math.round(PAD.t+spanY*CELL_Y+PAD.b); }
    canvas.width=w; canvas.height=hh;
  }
  function setAnisoCubic(){ XMIN=-3.5;XMAX=3.5;YMIN=-28;YMAX=28; CELL_X=82;CELL_Y=14; LABEL_Y_STEP=1; sizeCanvas(); }
  function setAnisoBoth(){ XMIN=-28;XMAX=28;YMIN=-28;YMAX=28; CELL_X=16;CELL_Y=16; LABEL_Y_STEP=2; sizeCanvas(); }
  function worldToScreen(x,y){ var w=canvas.width-PAD.l-PAD.r,hh=canvas.height-PAD.t-PAD.b; return {x:PAD.l+((x-XMIN)/(XMAX-XMIN))*w,y:PAD.t+((YMAX-y)/(YMAX-YMIN))*hh}; }

  function drawGrid(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#0f172a"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#1e293b"; ctx.lineWidth=1;
    var xi,yi,p0,p1;
    for(xi=Math.ceil(XMIN);xi<=Math.floor(XMAX);xi++){ p0=worldToScreen(xi,YMIN); p1=worldToScreen(xi,YMAX); ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke(); }
    for(yi=Math.ceil(YMIN);yi<=Math.floor(YMAX);yi++){ p0=worldToScreen(XMIN,yi); p1=worldToScreen(XMAX,yi); ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke(); }
    var ox=worldToScreen(0,0);
    ctx.strokeStyle="#64748b"; ctx.lineWidth=1.6;
    ctx.beginPath(); if(0>=YMIN&&0<=YMAX){ ctx.moveTo(PAD.l,ox.y); ctx.lineTo(canvas.width-PAD.r,ox.y);} ctx.stroke();
    ctx.beginPath(); if(0>=XMIN&&0<=XMAX){ ctx.moveTo(ox.x,PAD.t); ctx.lineTo(ox.x,canvas.height-PAD.b);} ctx.stroke();
    if(state.diag){
      ctx.save(); ctx.strokeStyle=AXIS_GLOW; ctx.lineWidth=3; ctx.shadowColor="rgba(255,191,0,0.65)"; ctx.shadowBlur=10;
      var lo=Math.max(XMIN,YMIN), hi=Math.min(XMAX,YMAX);
      var d0=worldToScreen(lo,lo), d1=worldToScreen(hi,hi);
      ctx.beginPath(); ctx.moveTo(d0.x,d0.y); ctx.lineTo(d1.x,d1.y); ctx.stroke();
      ctx.shadowBlur=0; ctx.fillStyle=AXIS_GLOW; ctx.font="800 12px ui-monospace, Menlo, monospace";
      ctx.fillText("y = x · espejo", d1.x-110, d1.y+14); ctx.restore();
    }
    ctx.fillStyle=MUTED; ctx.font="600 11px ui-monospace, Menlo, monospace";
    ctx.textAlign="center"; ctx.textBaseline="top";
    var xStep=(XMAX-XMIN)>40?2:1;
    for(var xt=Math.ceil(XMIN);xt<=Math.floor(XMAX);xt++){
      if(xt===0||(xStep>1&&xt%xStep!==0)) continue;
      var sx=worldToScreen(xt,0);
      ctx.beginPath(); ctx.moveTo(sx.x,sx.y-3); ctx.lineTo(sx.x,sx.y+3); ctx.stroke();
      ctx.fillText(String(xt).replace("-","−"), sx.x, sx.y+7);
    }
    ctx.textAlign="right"; ctx.textBaseline="middle";
    var yStep=LABEL_Y_STEP||1;
    for(var yt=Math.ceil(YMIN);yt<=Math.floor(YMAX);yt++){
      if(yt===0||yt%yStep!==0) continue;
      var sy=worldToScreen(0,yt);
      ctx.beginPath(); ctx.moveTo(sy.x-3,sy.y); ctx.lineTo(sy.x+3,sy.y); ctx.stroke();
      ctx.fillText(fmtNum(yt), sy.x-7, sy.y);
    }
    ctx.fillStyle="#94a3b8"; ctx.font="700 12px Segoe UI, system-ui, sans-serif";
    ctx.textAlign="left"; ctx.fillText("x", canvas.width-PAD.r-14, Math.min(canvas.height-22, ox.y+10));
    ctx.fillText("y", Math.max(8, ox.x+8), PAD.t+14);
  }
  function drawCurve(fn, color, alpha){
    var steps=360; ctx.save(); ctx.globalAlpha=alpha==null?1:alpha; ctx.strokeStyle=color; ctx.lineWidth=3.2; ctx.lineJoin="round"; ctx.beginPath();
    var first=true;
    for(var i=0;i<=steps;i++){
      var x=XMIN+(XMAX-XMIN)*(i/steps), y=fn(x);
      if(!isFinite(y)||y<YMIN-2||y>YMAX+2){ first=true; continue; }
      var s=worldToScreen(x,y);
      if(first){ ctx.moveTo(s.x,s.y); first=false; } else ctx.lineTo(s.x,s.y);
    }
    ctx.stroke(); ctx.restore();
  }
  function drawPoint(x,y,label,color,glow){
    var p=worldToScreen(x,y);
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x,p.y,11,0,Math.PI*2); ctx.fillStyle=glow||AMBER_GLOW; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x,p.y,6.5,0,Math.PI*2); ctx.fillStyle=color||AMBER; ctx.fill();
    ctx.strokeStyle="#fef3c7"; ctx.lineWidth=1.8; ctx.stroke();
    if(label){ ctx.fillStyle="#fef3c7"; ctx.font="800 12px Segoe UI, system-ui, sans-serif"; ctx.textBaseline="bottom";
      ctx.textAlign="left"; ctx.fillText(label, p.x+10, p.y-8); }
    ctx.restore();
  }
  function drawMirrorSeg(pt){
    var q=mirrorPt(pt); var a=worldToScreen(pt.x,pt.y), b=worldToScreen(q.x,q.y);
    ctx.save(); ctx.strokeStyle="rgba(255,191,0,0.55)"; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }

  var LATTICE = [
    {x:0,y:0},{x:1,y:1},{x:-1,y:-1},{x:2,y:8},{x:-2,y:-8},{x:3,y:27},{x:-3,y:-27}
  ];

  function draw(){
    drawGrid();
    if(state.showCurve) drawCurve(function(x){ return cube(x); }, CURVE_CUB, state.showCbrt?0.35:0.95);
    if(state.showCbrt) drawCurve(function(x){ return cbrt(x); }, CURVE_CBRT, 0.95);
    var nShown = state.shown.length;
    for(var i=0;i<nShown;i++){
      var pt=state.shown[i];
      if(pt.kind==="cub") drawPoint(pt.x,pt.y,fmtPt(pt),AMBER,AMBER_GLOW);
      else {
        if(state.showMirror) drawMirrorSeg({x:pt.ox,y:pt.oy});
        drawPoint(pt.x,pt.y,fmtPt(pt),MIR,MIR_GLOW);
      }
    }
  }

  function resetView(){
    clearTimers(); state.playing=false; state.phase="idle"; state.shown=[]; state.showCurve=false; state.showMirror=false; state.showCbrt=false; state.diag=false;
    setAnisoCubic();
    playBtn.disabled=false; stopBtn.disabled=true;
    exprFormula.innerHTML='y = <span class="hl-cub">x³</span>';
    if(exprMirror) exprMirror.innerHTML='inversa · <span class="hl-cbrt">y = ∛x</span> · espejo y=x';
    chipBox.innerHTML='<span class="chip cub">y = x³</span><span class="chip">retícula aniso</span><span class="chip cbrt">luego ∛</span>';
    setWork("");
    setCaption('Presioná <strong>▶ Play</strong> · construí <span class="hl-cub">y = x³</span> con puntos enteros · luego espejo sobre <span class="hl-axis">y = x</span> → <span class="hl-cbrt">y = ∛x</span>.');
    draw();
  }

  function runPlay(){
    if(state.playing) return;
    if(GK.ensureAudio) GK.ensureAudio();
    state.playing=true; state.loop++; loopEl.innerHTML="Bucle <strong>"+state.loop+"</strong>";
    playBtn.disabled=true; stopBtn.disabled=false;
    state.shown=[]; state.showCurve=false; state.showMirror=false; state.showCbrt=false; state.diag=false;
    setAnisoCubic(); draw();
    exprFormula.innerHTML='y = <span class="hl-cub">x³</span>';
    setCaption('Origen · retícula aniso (celdas X anchas, Y cortas) para que ±3 y ±27 se lean.');
    setWork('P₀ = (0, 0)');
    state.shown.push({x:0,y:0,kind:"cub"}); bip(); draw();

    var order = [1,-1,2,-2,3,-3];
    var delayMs = 700;
    order.forEach(function(n, idx){
      later(delayMs*(idx+1), function(){
        if(!state.playing) return;
        var pt={x:n,y:cube(n),kind:"cub"};
        state.shown.push(pt); bip();
        setWork(fmtNum(n)+"³ = <span class=\"hl\">"+fmtNum(pt.y)+"</span> · punto "+fmtPt(pt));
        setCaption('Punto retícula <span class="hl-cub">'+fmtPt(pt)+'</span> · y = x³.');
        draw();
      });
    });
    later(delayMs*(order.length+1)+200, function(){
      if(!state.playing) return;
      state.showCurve=true; bip();
      setCaption('Curva <span class="hl-cub">y = x³</span> · crece rápido · por eso la escala aniso.');
      setWork('y = x³');
      draw();
    });
    later(delayMs*(order.length+1)+1400, function(){
      if(!state.playing) return;
      setAnisoBoth(); state.diag=true; state.showMirror=true; bip();
      setCaption('Espejo <span class="hl-axis">y = x</span> · intercambiamos coordenadas (x,y) → (y,x).');
      setWork('(x, y) → (y, x)');
      draw();
    });
    later(delayMs*(order.length+1)+2200, function(){
      if(!state.playing) return;
      /* push mirrors with fixed length */
      var cubs = state.shown.filter(function(p){ return p.kind==="cub"; });
      var nPts = cubs.length;
      for(var i=0;i<nPts;i++){
        var m=mirrorPt(cubs[i]);
        state.shown.push({x:m.x,y:m.y,kind:"cbrt",ox:cubs[i].x,oy:cubs[i].y});
      }
      bip(); draw();
      setWork('puntos espejo · A′ = (y, x)');
    });
    later(delayMs*(order.length+1)+3000, function(){
      if(!state.playing) return;
      state.showCbrt=true; bip();
      if(exprMirror) exprMirror.innerHTML='y = <span class="hl-cbrt">∛x</span> · f⁻¹ · espejo y=x';
      chipBox.innerHTML='<span class="chip cub">y = x³</span><span class="chip cbrt">y = ∛x</span><span class="chip">espejo y=x</span>';
      setCaption('La inversa <span class="hl-cbrt">y = ∛x</span> es el espejo de <span class="hl-cub">y = x³</span> sobre <span class="hl-axis">y = x</span>.');
      setWork('y = ∛x = f⁻¹(x)');
      draw();
    });
    later(delayMs*(order.length+1)+4800, function(){
      if(!state.playing) return;
      state.playing=false; playBtn.disabled=false; stopBtn.disabled=true;
      setCaption('Listo · <strong>▶ Play</strong> otra vez · o seguí a la cúbica desplazada (L93).');
    });
  }

  function stopPlay(){ clearTimers(); state.playing=false; playBtn.disabled=false; stopBtn.disabled=true; }
  playBtn.addEventListener("click", runPlay);
  stopBtn.addEventListener("click", stopPlay);
  restartBtn.addEventListener("click", function(){ stopPlay(); resetView(); });
  slowBtn.addEventListener("click", function(){
    if(state.speedFactor===1){ state.speedFactor=2; slowBtn.classList.add("on"); slowBtn.setAttribute("aria-pressed","true"); }
    else { state.speedFactor=1; slowBtn.classList.remove("on"); slowBtn.setAttribute("aria-pressed","false"); }
  });
  resetView();

})();
</script>
</body>
</html>
