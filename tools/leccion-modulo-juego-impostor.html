  function fmtNum(n) {

      }
    }
    var ox = worldToScreen(0, 0);
    ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    if (0 >= XMIN && 0 <= XMAX) { ctx.moveTo(ox.x, PAD.t); ctx.lineTo(ox.x, canvas.height - PAD.b); }
    ctx.stroke();
    if (0 >= YMIN && 0 <= YMAX) {
      ctx.save();
      ctx.strokeStyle = AXIS_GLOW; ctx.lineWidth = 3.2;
      ctx.shadowColor = "rgba(255,191,0,0.65)"; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(PAD.l, ox.y); ctx.lineTo(canvas.width - PAD.r, ox.y); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = AXIS_GLOW; ctx.font = "800 12px ui-monospace, Menlo, monospace";
      ctx.textAlign = "right"; ctx.textBaseline = "bottom";
      ctx.fillText(TRIG_MODE ? "eje X (°) · solo f(x)<0" : "eje X · solo f(x)<0", canvas.width - PAD.r - 6, ox.y - 8);
      ctx.restore();
    }
    ctx.fillStyle = MUTED; ctx.font = "600 11px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    if (TRIG_MODE) {
      for (var xt = Math.ceil(XMIN / 90) * 90; xt <= XMAX + 1e-9; xt += 90) {
        if (Math.abs(xt) < 1e-9) continue;
        var sx = worldToScreen(xt, 0);
        ctx.strokeStyle = "#64748b";
        ctx.beginPath(); ctx.moveTo(sx.x, sx.y - 3); ctx.lineTo(sx.x, sx.y + 3); ctx.stroke();
        ctx.fillText(fmtDeg(xt), sx.x, sx.y + 7);
      }
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      [-1, 1].forEach(function (yt) {
        var sy = (0 >= XMIN && 0 <= XMAX) ? worldToScreen(0, yt) : worldToScreen(XMIN, yt);
        ctx.beginPath(); ctx.moveTo(sy.x - 3, sy.y); ctx.lineTo(sy.x + 3, sy.y); ctx.stroke();
        ctx.fillText(fmtNum(yt), sy.x - 7, sy.y);
      });
    } else {
      var step = (XMAX - XMIN) > 24 ? 2 : 1;
      for (var xt2 = Math.ceil(XMIN); xt2 <= Math.floor(XMAX); xt2++) {
        if (xt2 === 0 || (step > 1 && xt2 % step !== 0)) continue;
        var sx2 = worldToScreen(xt2, 0);
        ctx.strokeStyle = "#64748b";
        ctx.beginPath(); ctx.moveTo(sx2.x, sx2.y - 3); ctx.lineTo(sx2.x, sx2.y + 3); ctx.stroke();
        ctx.fillText(String(xt2).replace("-", "−"), sx2.x, sx2.y + 7);
      }
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      for (var yt2 = Math.ceil(YMIN); yt2 <= Math.floor(YMAX); yt2++) {
        if (yt2 === 0 || (step > 1 && yt2 % step !== 0)) continue;
        var sy2 = (0 >= XMIN && 0 <= XMAX) ? worldToScreen(0, yt2) : worldToScreen(XMIN, yt2);
        ctx.beginPath(); ctx.moveTo(sy2.x - 3, sy2.y); ctx.lineTo(sy2.x + 3, sy2.y); ctx.stroke();
        ctx.fillText(fmtNum(yt2), sy2.x - 7, sy2.y);
      }
    }
  }
  /** mode: "orig" | "abs" | "negOnly" — or boolean absed for compat */
  function drawCurveFam(fam, mode, alpha, color) {
    if (mode === true) mode = "abs";
    if (mode === false || mode == null) mode = "orig";
    var steps = isTrig(fam) ? 720 : 320;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.strokeStyle = color || (mode === "abs" ? CURVE_ABS : (mode === "negOnly" ? NEG_HL : CURVE_ORIG));
    ctx.lineWidth = mode === "abs" ? 3.4 : (mode === "negOnly" ? 3.2 : 2.6);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    var first = true, lastX = null, lastY = null;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var x = XMIN + (XMAX - XMIN) * t;
      var y = fOf(fam, x);
      if (y == null || !isFinite(y)) { first = true; lastX = null; lastY = null; continue; }
      if (mode === "abs") y = Math.abs(y);
      if (mode === "negOnly") {
        if (y >= -1e-12) { first = true; lastX = null; lastY = null; continue; }
      }
      if (y < YMIN - 1 || y > YMAX + 1) { first = true; lastX = null; lastY = null; continue; }
      if (fam.kind === "hyperbola" && lastX != null && lastX * x <= 0) first = true;
      if (mode === "negOnly" && lastY != null && lastY * y <= 0) first = true;
      var s = worldToScreen(x, y);
      if (first) { ctx.moveTo(s.x, s.y); first = false; } else ctx.lineTo(s.x, s.y);
      lastX = x; lastY = y;
    }
    ctx.stroke();
    ctx.restore();
  }
  function drawPoint(x, y, label, color, glow) {
    var p = worldToScreen(x, y);
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); ctx.fillStyle = glow || AMBER_GLOW; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fillStyle = color || AMBER; ctx.fill();
    ctx.strokeStyle = "#fef3c7"; ctx.lineWidth = 2; ctx.stroke();
    if (label) {
      ctx.fillStyle = "#fef3c7"; ctx.font = "800 13px Segoe UI, system-ui, sans-serif"; ctx.textBaseline = "bottom";
      var lx = p.x + 12, ly = p.y - 10;
      if (lx > canvas.width - 90) lx = p.x - 12; if (ly < 22) ly = p.y + 22;
      ctx.textAlign = lx < p.x ? "right" : "left"; ctx.fillText(label, lx, ly);
    }
    ctx.restore();
  }
  function drawHover(pt) {
    if (!pt) return;
    var p = worldToScreen(pt.x, pt.y);
    ctx.save();
    ctx.strokeStyle = "rgba(255,191,0,0.7)"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,191,0,0.85)"; ctx.font = "700 12px ui-monospace, Menlo, monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText(fmtPt(pt), p.x + 14, p.y - 12);
    ctx.restore();
  }
  function drawArrow(x0, y0, x1, y1, color) {
    var a = worldToScreen(x0, y0), b = worldToScreen(x1, y1);
    var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    var ux = dx / len, uy = dy / len, head = 11;
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x - ux * 5, b.y - uy * 5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - ux * head - uy * head * 0.45, b.y - uy * head + ux * head * 0.45);
    ctx.lineTo(b.x - ux * head + uy * head * 0.45, b.y - uy * head - ux * head * 0.45);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  /** Fixed-length vertical push: (x,y)→(x,|y|) for y<0 only. */
  function drawAbsSegment(pt) {
    if (!needsMirror(pt)) return;
    var q = absPt(pt);
    var a = worldToScreen(pt.x, pt.y), b = worldToScreen(q.x, q.y);
    var mid = worldToScreen(pt.x, 0);
    ctx.save();
    ctx.strokeStyle = "rgba(255,191,0,0.55)"; ctx.lineWidth = 1.8; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(mid.x, mid.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = AXIS_GLOW; ctx.fill();
    ctx.restore();
    drawArrow(pt.x, pt.y, q.x, q.y, MIR);
  }
  /** Guías verticales en cada cero: línea de puntos hacia ABAJO (tic tic) en zona caqui. */
  function drawZeros(fam) {
    fam = fam || null;
    var zs = (fam && fam._zeros) || (fam ? findZeros(fam) : []) || [];
    var deg = isTrig(fam);
    zs.forEach(function (z) {
      if (z < XMIN - 1e-9 || z > XMAX + 1e-9) return;
      var p = worldToScreen(z, 0);
      var bottom = canvas.height - PAD.b;
      ctx.save();
      ctx.strokeStyle = "#fde68a"; ctx.lineWidth = 2; ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, bottom); ctx.stroke();
      ctx.setLineDash([]);
      var yTick = p.y + 14;
      while (yTick < bottom - 8) {
        ctx.beginPath(); ctx.moveTo(p.x - 5, yTick); ctx.lineTo(p.x + 5, yTick); ctx.stroke();
        yTick += 14;
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#fde68a"; ctx.fill();
      ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#fde68a"; ctx.font = "800 11px ui-monospace, Menlo, monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "bottom";
      ctx.fillText(deg ? fmtDeg(z) : "cero", p.x + 8, p.y - 6);
      ctx.restore();
    });
  }
  function showVictory(sub) {
    state.won = true; state.locked = true;
    var subEl = victoryBanner.querySelector(".sub-v");
    if (subEl && sub) subEl.textContent = sub;
    victoryBanner.classList.add("on");
    if (GK.fireConfetti) { GK.fireConfetti(confettiCanvas); later(400, function () { if (GK.fireConfetti) GK.fireConfetti(confettiCanvas); }); }
    if (GK.playExplosion) GK.playExplosion(); else if (GK.playOkChime) GK.playOkChime();
    setPrompt("¡Ganador! 20 éxitos. <strong>Seguir</strong> o <strong>Reiniciar</strong>.", "ok");
  }
  function togglePause() {
    if (state.won) return;
    state.paused = !state.paused;
    pausedBanner.classList.toggle("on", state.paused);
    pauseBtn.textContent = state.paused ? "Continuar" : "Pausar";
    pauseBtn.classList.toggle("pause-on", state.paused);
    if (state.paused) setPrompt("Pausa · tocá <strong>Continuar</strong> para seguir.", "");
  }
  function toggleSlow() {
    if (state.speedFactor === 1) { state.speedFactor = 2; slowBtn.classList.add("on"); slowBtn.setAttribute("aria-pressed", "true"); }
    else { state.speedFactor = 1; slowBtn.classList.remove("on"); slowBtn.setAttribute("aria-pressed", "false"); }
  }
  function resizeConfetti() {
    if (!confettiCanvas || !graphWrap) return;
    confettiCanvas.width = graphWrap.clientWidth || canvas.width;
    confettiCanvas.height = graphWrap.clientHeight || canvas.height;
  }
  function wireChrome(restartFn, keepFn) {
    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", restartFn);
    if (victoryRestart) victoryRestart.addEventListener("click", restartFn);
    if (victoryContinue) victoryContinue.addEventListener("click", keepFn);
    if (slowBtn) { slowBtn.addEventListener("click", toggleSlow); slowBtn.setAttribute("aria-pressed", "false"); }
    window.addEventListener("resize", function () { resizeConfetti(); if (typeof draw === "function") draw(); });
    resizeConfetti();
  }
  function standardRestart() {
    return function restart() {
      state.paused = false; pauseBtn.textContent = "Pausar"; pauseBtn.classList.remove("pause-on"); pausedBanner.classList.remove("on");
      startRound(false);
    };
  }
  function standardKeep() {
    return function keepPlaying() {
      state.won = false; state.paused = false; pauseBtn.textContent = "Pausar"; pauseBtn.classList.remove("pause-on");
      pausedBanner.classList.remove("on"); victoryBanner.classList.remove("on"); state.ok = 0; syncScores(); nextRound();
    };
  }
  function successRound(msg, victorySub) {
    state.reveal = true; state.ok++; syncScores(); pulseOk();
    if (GK.fireConfetti) GK.fireConfetti(confettiCanvas);
    setPrompt(msg, "ok"); draw();
    if (state.ok >= WIN_AT) { later(700, function () { showVictory(victorySub); }); return; }
    later(1100, nextRound);
  }
  function failRound(msg) {
    state.bad++; syncScores(); pulseBad(); setPrompt(msg, "bad");
    later(900, function () { state.locked = false; if (state.placed !== undefined) state.placed = null; draw(); });
  }

var state = { ok:0,bad:0,round:1,fam:null,src:[],points:[],impostorIdx:0,locked:false,paused:false,won:false,speedFactor:1,timers:[],reveal:false,hover:null,familyIdx:0 };
  var FAMILY_ROT = ["linear","quadratic","sine","sqrt","exp","log","hyperbola","cosine"];
  function buildRound(){
    var kind = FAMILY_ROT[state.familyIdx % FAMILY_ROT.length];
    state.familyIdx++;
    state.fam = ensureNegFamily(kind);
    var pool = shuffle(state.fam.points.slice());
    var src = pool.slice(0, 4);
    while (src.length < 4) {
      var extra = makeFamily(kind).points[0];
      if (extra && !src.some(function(q){ return nearPt(q, extra, 0.01); })) src.push(extra);
      else src.push({ x: src.length + 1, y: -(src.length + 1) });
    }
    src = src.slice(0, 4);
    state.src = src;
    /* 4 valid |f| images: (x,|y|) */
    var goods = src.map(function(p, i){ return { x: p.x, y: Math.abs(p.y), label: "M" + (i+1), good: true }; });
    state.impostorIdx = (Math.random() * 5) | 0;
    var base = goods[(Math.random() * goods.length) | 0];
    var impostor = {
      x: base.x + (Math.random() < 0.5 ? 1 : -1) * (1 + ((Math.random()*2)|0)),
      y: Math.abs(base.y) + (Math.random() < 0.5 ? 1 : 2),
      label: "?", good: false
    };
    function isTrueAbs(pt){
      return src.some(function(s){ return s.x === pt.x && Math.abs(s.y) === pt.y; });
    }
    var tries = 0;
    while ((isTrueAbs(impostor) || impostor.y < 0) && tries++ < 30) {
      impostor.y = Math.abs(impostor.y) + 1;
      impostor.x += (Math.random() < 0.5 ? 1 : -1);
    }
    var pts = goods.slice();
    pts.splice(state.impostorIdx, 0, impostor);
    for (var i = 0; i < pts.length; i++) for (var j = i+1; j < pts.length; j++) {
      if (pts[i].x === pts[j].x && pts[i].y === pts[j].y) pts[state.impostorIdx].x += 1;
    }
    state.points = pts; state.reveal = false; state.hover = null;
    clampWorldPts(src.concat(pts), 1.5);
  }
  function hitIndex(pt){ for (var i = 0; i < state.points.length; i++) if (nearPt(pt, state.points[i], 0.45)) return i; return -1; }
  function draw(){
    drawGrid();
    drawCurveFam(state.fam, "orig", 0.25, CURVE_ORIG);
    state.src.forEach(function(p, i){
      drawPoint(p.x, p.y, "A"+(i+1), needsMirror(p) ? NEG_HL : ORIG, needsMirror(p) ? "rgba(255,123,123,0.35)" : AMBER_GLOW);
    });
    for (var i = 0; i < state.points.length; i++) {
      var pt = state.points[i], isImp = i === state.impostorIdx;
      var col = state.reveal ? (isImp ? BAD : OK) : MIR;
      var glow = state.reveal ? (isImp ? "rgba(255,123,123,0.4)" : "rgba(90,212,168,0.35)") : MIR_GLOW;
      drawPoint(pt.x, pt.y, pt.label + " " + fmtPt(pt), col, glow);
    }
    drawHover(state.hover);
  }
  function onMove(ev){
    if (state.paused||state.locked||state.won||state.reveal) return;
    var c = eventToCanvas(ev);
    var w = screenToWorld(c.x, c.y);
    state.hover = snapLattice(w.x, w.y); draw();
  }
  function onClick(ev){
    if (state.paused||state.locked||state.won) return;
    if (GK.ensureAudio) GK.ensureAudio();
    var c = eventToCanvas(ev);
    var w = screenToWorld(c.x, c.y);
    var pt = snapLattice(w.x, w.y);
    var idx = hitIndex(pt);
    if (idx < 0) { setPrompt("Tocá uno de los 5 puntos |f| (cyan).", "bad"); return; }
    state.locked = true;
    if (idx === state.impostorIdx) {
      successRound("¡Cazado! Ese no es |f| de ningún Ai · (x,y)→(x,|y|).", "20 éxitos · módulo · impostor");
    } else {
      state.bad++; syncScores(); pulseBad();
      setPrompt("Ese sí es un |f| válido. Buscá el impostor.", "bad");
      later(800, function(){ state.locked = false; });
    }
  }
  function startRound(keepScores){
    clearTimers(); buildRound(); state.locked = false;
    if (!keepScores) { state.ok=0; state.bad=0; state.round=1; state.familyIdx=0; }
    state.won = false; victoryBanner.classList.remove("on");
    exprFormula.innerHTML = formulaHTML(state.fam, false);
    chipBox.innerHTML = '<span class="chip orig">4 orígenes</span><span class="chip mir">5 candidatos |f|</span><span class="chip">1 impostor</span><span class="chip">'+familyLabel(state.fam.kind)+'</span>';
    sideHint.textContent = "Tocá el punto falso";
    if (modeTagEl) modeTagEl.textContent = "Impostor";
    syncScores();
    setPrompt("Cuatro cyan son <span class=\"hl-abs\">(x,|y|)</span> de los ámbar. <strong>Uno es impostor</strong>. ¿Cuál?", "attention");
    draw();
  }
  function nextRound(){ state.round++; syncScores(); startRound(true); }
  canvas.addEventListener("click", onClick); canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("touchstart", function(ev){ ev.preventDefault(); onClick(ev); }, { passive:false });
  wireChrome(standardRestart(), standardKeep()); startRound(false);

})();
</script>
