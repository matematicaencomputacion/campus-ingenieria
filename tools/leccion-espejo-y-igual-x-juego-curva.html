  function fOf(fam, x) {

  function fmtSlope(m) {

  function familyLabel(kind) {

  function makeLinear() {
    var opts = [

  function makeSqrt() {

    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    var lab = worldToScreen(Math.min(hi - 0.5, XMAX - 0.8), Math.min(hi - 0.5, YMAX - 0.8));
    ctx.fillText("y = x · espejo", lab.x + 6, lab.y - 4);
    ctx.restore();
    ctx.fillStyle = MUTED; ctx.font = "600 11px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    var step = (XMAX - XMIN) > 24 ? 2 : 1;
    for (var xt = Math.ceil(XMIN); xt <= Math.floor(XMAX); xt++) {
      if (xt === 0 || (step > 1 && xt % step !== 0)) continue;
      var sx = worldToScreen(xt, 0);
      ctx.strokeStyle = "#64748b";
      ctx.beginPath(); ctx.moveTo(sx.x, sx.y - 3); ctx.lineTo(sx.x, sx.y + 3); ctx.stroke();
      ctx.fillText(String(xt).replace("-", "−"), sx.x, sx.y + 7);
    }
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (var yt = Math.ceil(YMIN); yt <= Math.floor(YMAX); yt++) {
      if (yt === 0 || (step > 1 && yt % step !== 0)) continue;
      var sy = (0 >= XMIN && 0 <= XMAX) ? worldToScreen(0, yt) : worldToScreen(XMIN, yt);
      ctx.beginPath(); ctx.moveTo(sy.x - 3, sy.y); ctx.lineTo(sy.x + 3, sy.y); ctx.stroke();
      ctx.fillText(fmtNum(yt), sy.x - 7, sy.y);
    }
  }
  function drawCurveFam(fam, mirrored, alpha, color) {
    var steps = 320;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.strokeStyle = color || (mirrored ? CURVE_MIR : CURVE_ORIG);
    ctx.lineWidth = mirrored ? 3.4 : 2.6;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    var first = true, lastX = null;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var x = XMIN + (XMAX - XMIN) * t;
      var y = fOf(fam, x);
      if (y == null || !isFinite(y)) { first = true; lastX = null; continue; }
      var px = mirrored ? y : x;
      var py = mirrored ? x : y;
      if (py < YMIN - 1 || py > YMAX + 1 || px < XMIN - 1 || px > XMAX + 1) { first = true; lastX = null; continue; }
      if (fam.kind === "hyperbola" && lastX != null && lastX * x <= 0) { first = true; }
      var s = worldToScreen(px, py);
      if (first) { ctx.moveTo(s.x, s.y); first = false; } else ctx.lineTo(s.x, s.y);
      lastX = x;
    }
    ctx.stroke();
    ctx.restore();
  }
  function drawPoint(x, y, label, color, glow) {
    var p = worldToScreen(x, y);
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); ctx.fillStyle = glow || AMBER_GLOW; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fillStyle = color || AMBER; ctx.fill();
    ctx.strokeStyle = "#fef3c7"; ctx.lineWidth = 2; ctx.stroke();
    if (label) {
      ctx.fillStyle = "#fef3c7"; ctx.font = "800 13px Segoe UI, system-ui, sans-serif"; ctx.textBaseline = "bottom";
      var lx = p.x + 12, ly = p.y - 10;
      if (lx > canvas.width - 90) lx = p.x - 12; if (ly < 22) ly = p.y + 22;
      ctx.textAlign = lx < p.x ? "right" : "left"; ctx.fillText(label, lx, ly);
    }
    ctx.restore();
  }
  function drawHover(pt) {
    if (!pt) return;
    var p = worldToScreen(pt.x, pt.y);
    ctx.save();
    ctx.strokeStyle = "rgba(255,191,0,0.7)"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,191,0,0.85)"; ctx.font = "700 12px ui-monospace, Menlo, monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText(fmtPt(pt), p.x + 14, p.y - 12);
    ctx.restore();
  }
  function drawArrow(x0, y0, x1, y1, color) {
    var a = worldToScreen(x0, y0), b = worldToScreen(x1, y1);
    var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    var ux = dx / len, uy = dy / len, head = 11;
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x - ux * 5, b.y - uy * 5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - ux * head - uy * head * 0.45, b.y - uy * head + ux * head * 0.45);
    ctx.lineTo(b.x - ux * head + uy * head * 0.45, b.y - uy * head - ux * head * 0.45);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function drawMirrorSegment(pt) {
    var q = mirrorPt(pt);
    var F = footOnDiag(pt);
    var a = worldToScreen(pt.x, pt.y), b = worldToScreen(q.x, q.y);
    var mid = worldToScreen(F.x, F.y);
    ctx.save();
    ctx.strokeStyle = "rgba(255,191,0,0.55)"; ctx.lineWidth = 1.8; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(mid.x, mid.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = AXIS_GLOW; ctx.fill();
    ctx.restore();
    drawArrow(pt.x, pt.y, q.x, q.y, MIR);
  }
  function showVictory(sub) {
    state.won = true; state.locked = true;
    var subEl = victoryBanner.querySelector(".sub-v");
    if (subEl && sub) subEl.textContent = sub;
    victoryBanner.classList.add("on");
    if (GK.fireConfetti) { GK.fireConfetti(confettiCanvas); later(400, function () { if (GK.fireConfetti) GK.fireConfetti(confettiCanvas); }); }
    if (GK.playExplosion) GK.playExplosion(); else if (GK.playOkChime) GK.playOkChime();
    setPrompt("¡Ganador! 20 éxitos. <strong>Seguir</strong> o <strong>Reiniciar</strong>.", "ok");
  }
  function togglePause() {
    if (state.won) return;
    state.paused = !state.paused;
    pausedBanner.classList.toggle("on", state.paused);
    pauseBtn.textContent = state.paused ? "Continuar" : "Pausar";
    pauseBtn.classList.toggle("pause-on", state.paused);
    if (state.paused) setPrompt("Pausa · tocá <strong>Continuar</strong> para seguir.", "");
  }
  function toggleSlow() {
    if (state.speedFactor === 1) { state.speedFactor = 2; slowBtn.classList.add("on"); slowBtn.setAttribute("aria-pressed", "true"); }
    else { state.speedFactor = 1; slowBtn.classList.remove("on"); slowBtn.setAttribute("aria-pressed", "false"); }
  }
  function resizeConfetti() {
    if (!confettiCanvas || !graphWrap) return;
    confettiCanvas.width = graphWrap.clientWidth || canvas.width;
    confettiCanvas.height = graphWrap.clientHeight || canvas.height;
  }
  function wireChrome(restartFn, keepFn) {
    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", restartFn);
    if (victoryRestart) victoryRestart.addEventListener("click", restartFn);
    if (victoryContinue) victoryContinue.addEventListener("click", keepFn);
    if (slowBtn) { slowBtn.addEventListener("click", toggleSlow); slowBtn.setAttribute("aria-pressed", "false"); }
    window.addEventListener("resize", function () { resizeConfetti(); if (typeof draw === "function") draw(); });
    resizeConfetti();
  }
  function standardRestart() {
    return function restart() {
      state.paused = false; pauseBtn.textContent = "Pausar"; pauseBtn.classList.remove("pause-on"); pausedBanner.classList.remove("on");
      startRound(false);
    };
  }
  function standardKeep() {
    return function keepPlaying() {
      state.won = false; state.paused = false; pauseBtn.textContent = "Pausar"; pauseBtn.classList.remove("pause-on");
      pausedBanner.classList.remove("on"); victoryBanner.classList.remove("on"); state.ok = 0; syncScores(); nextRound();
    };
  }
  function successRound(msg, victorySub) {
    state.reveal = true; state.ok++; syncScores(); pulseOk();
    if (GK.fireConfetti) GK.fireConfetti(confettiCanvas);
    setPrompt(msg, "ok"); draw();
    if (state.ok >= WIN_AT) { later(700, function () { showVictory(victorySub); }); return; }
    later(1100, nextRound);
  }
  function failRound(msg) {
    state.bad++; syncScores(); pulseBad(); setPrompt(msg, "bad");
    later(900, function () { state.locked = false; if (state.placed !== undefined) state.placed = null; draw(); });
  }

var state = { ok:0,bad:0,round:1,fam:null,opts:[],correctIdx:0,locked:false,paused:false,won:false,speedFactor:1,timers:[],reveal:false,familyIdx:0 };
  var FAMILY_ROT = ["linear","quadratic","sqrt","exp","log","hyperbola"];
  function decoyFamily(good){
    var tries = 0, d;
    do { d = makeFamily(good.kind); tries++; }
    while (tries < 12 && formulaHTML(d,false) === formulaHTML(good,false));
    if (d.kind === "linear") { d.m = -d.m; d.points = d.points.map(function(p){ return {x:p.x,y:d.m*p.x+d.b}; }); }
    else if (d.kind === "quadratic") { d.v = -d.v; d.points = d.points.map(function(p){ return {x:p.x,y:(d.v)* (p.x-d.xp)*(p.x-d.xp)+d.yp}; }); }
    else if (d.kind === "hyperbola") { d.k = -d.k; d.points = d.points.map(function(p){ return {x:p.x,y:d.k/p.x}; }); }
    else if (d.kind === "sqrt") { d.v = -Math.abs(d.v); }
    else if (d.kind === "exp") { d.v = -Math.abs(d.v||1); }
    return d;
  }
  function buildRound(){
    var kind = FAMILY_ROT[state.familyIdx % FAMILY_ROT.length];
    state.familyIdx++;
    state.fam = makeFamily(kind);
    var correct = { fam: state.fam, mirrored: true, label: "espejo y=x" };
    var wrong1 = { fam: state.fam, mirrored: false, label: "y = f(x) (sin espejo)" };
    var wrong2 = { fam: decoyFamily(state.fam), mirrored: true, label: "otra curva" };
    var wrong3 = { fam: makeFamily(pick(FAMILY_ROT.filter(function(k){ return k !== kind; }))), mirrored: true, label: "otra familia" };
    state.opts = shuffle([correct, wrong1, wrong2, wrong3]);
    state.correctIdx = state.opts.indexOf(correct);
    if (state.correctIdx < 0) {
      for (var i = 0; i < state.opts.length; i++) if (state.opts[i].label === "espejo y=x" && state.opts[i].fam === state.fam) state.correctIdx = i;
    }
    state.reveal = false;
    fitFamily(state.fam);
  }
  function draw(){
    drawGrid();
    drawCurveFam(state.fam, false, 0.45, CURVE_ORIG);
    for (var i = 0; i < (state.fam.points||[]).length; i++) {
      var p = state.fam.points[i];
      drawPoint(p.x, p.y, "", ORIG, AMBER_GLOW);
    }
    if (state.reveal) {
      drawCurveFam(state.fam, true, 0.95, CURVE_MIR);
      for (var j = 0; j < state.fam.points.length; j++) {
        var q = mirrorPt(state.fam.points[j]);
        drawPoint(q.x, q.y, "", MIR, MIR_GLOW);
      }
    } else if (state.previewIdx != null && state.opts[state.previewIdx]) {
      var o = state.opts[state.previewIdx];
      drawCurveFam(o.fam, o.mirrored, 0.85, o.mirrored ? CURVE_MIR : BAD);
    }
  }
  function renderChips(){
    chipBox.innerHTML = "";
    var html = '<div class="chip-grid" id="optGrid"></div>';
    chipBox.innerHTML = html;
    var grid = document.getElementById("optGrid");
    var labels = ["A","B","C","D"];
    state.opts.forEach(function(o, idx){
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "chip-btn";
      btn.textContent = labels[idx] + " · " + (o.mirrored ? "espejo y=x" : "original") + (o.fam.kind !== state.fam.kind ? " · " + familyLabel(o.fam.kind) : "");
      btn.title = formulaHTML(o.fam, o.mirrored);
      btn.addEventListener("mouseenter", function(){ if (!state.locked && !state.reveal) { state.previewIdx = idx; draw(); } });
      btn.addEventListener("mouseleave", function(){ if (!state.locked && !state.reveal) { state.previewIdx = null; draw(); } });
      btn.addEventListener("click", function(){ choose(idx, btn); });
      grid.appendChild(btn);
    });
  }
  function choose(idx, btn){
    if (state.paused||state.locked||state.won) return;
    if (GK.ensureAudio) GK.ensureAudio();
    state.locked = true;
    var btns = chipBox.querySelectorAll(".chip-btn");
    btns.forEach(function(b){ b.disabled = true; });
    if (idx === state.correctIdx) {
      btn.classList.add("correct");
      successRound("Correcto · la curva espejo es el intercambio de ejes · (x,y)↔(y,x).", "20 éxitos · espejo y=x · curva");
    } else {
      btn.classList.add("wrong");
      if (btns[state.correctIdx]) btns[state.correctIdx].classList.add("correct");
      state.bad++; syncScores(); pulseBad();
      setPrompt("La espejo sobre <span class=\"hl-axis\">y = x</span> intercambia ejes · x = f(y) / f⁻¹.", "bad");
      state.reveal = true; draw();
      later(1400, function(){ nextRound(); });
    }
  }
  function startRound(keepScores){
    clearTimers(); buildRound(); state.locked = false; state.previewIdx = null;
    if (!keepScores) { state.ok=0; state.bad=0; state.round=1; state.familyIdx=0; }
    state.won = false; victoryBanner.classList.remove("on");
    exprFormula.innerHTML = formulaHTML(state.fam, false) + ' <span style="color:var(--muted)">→</span> <span class="hl-mir">espejo y=x</span>';
    sideHint.textContent = "¿Cuál es el espejo?";
    if (modeTagEl) modeTagEl.textContent = "Curva";
    syncScores();
    setPrompt("Original en <span class=\"hl-orig\">ámbar</span>. Elegí la curva espejo respecto de <span class=\"hl-axis\">y = x</span>.", "attention");
    renderChips(); draw();
  }
  function nextRound(){ state.round++; syncScores(); startRound(true); }
  wireChrome(standardRestart(), standardKeep()); startRound(false);

})();
</script>
